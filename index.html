<script>
/* ========================= STORAGE (Claude artifact OR standalone phone) ========================= */
const STORAGE_KEY = 'sl-tracker-state-v1';
const APP_VERSION = '77';
// Pomodoro : XP fixe par minute de focus et bornes de durée (voir pomoSessionXP).
const POMO_XP_PER_MIN = 0.8;
const POMO_MIN_WORK = 10, POMO_MAX_WORK = 90;
const hasClaudeStorage = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storeGet(key){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ /* fall through */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storeSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){ /* ignore */ }
}

/* ========================= STATE ========================= */
const DEFAULT_STATE = () => ({
  hunterXP: 0,
  hunterLevel: 1,
  skills: {
    focus: {name:'Focus', level:1, xp:0},
    force: {name:'Force', level:1, xp:0},
    apprentissage: {name:'Apprentissage', level:1, xp:0},
    nutrition: {name:'Nutrition', level:1, xp:0},
    discipline: {name:'Discipline', level:1, xp:0},
  },
  routines: [
    {id:'r1', name:'Séance de sport', skill:'force', xp:25, lastDoneDate:null, streak:0, time:null, lastPenaltyDate:null, notifiedDate:null, morning:false, freqTag:'quotidienne', deadlinePenalty:false, deadlinePenalizedDate:null},
    {id:'r2', name:'Lecture / apprentissage', skill:'apprentissage', xp:20, lastDoneDate:null, streak:0, time:null, lastPenaltyDate:null, notifiedDate:null, morning:false, freqTag:'quotidienne', deadlinePenalty:false, deadlinePenalizedDate:null},
  ],
  tasks: [],
  goals: [],
  pomo: {workMin:25, breakMin:5, skill:'focus', completedToday:0, lastPomoDate:null, dailyGoal:4, dailyGoalRewarded:false, combo:{count:0, lastAt:0}, log:[]},
  water: {goalMl:3000, currentMl:0, skill:'nutrition', xpOnGoal:30, goalRewarded:false, lastDate:null},
  settings: {soundOn:true, penaltiesEnabled:true, notificationsOn:false, pomoPenaltyEnabled:false, identityTitlesEnabled:true, fullHeaderEverywhere:false, visualTheme:'monarch', monarchPreviewDone:true, welcomeDismissed:false, personalAvatar:false, awakeningDone:false},
  todayStats: {date:null, xpGained:0, routinesDone:0, tasksDone:0, goalsDone:0, focusMinutes:0, tasksAbandoned:0, xpBySkill:{}},
  history: [],
  stats: {
    totalTasksDone:0, totalRoutinesDone:0, totalGoalsDone:0, tasksAbandoned:0,
    totalFocusMinutes:0, bestStreak:0, perfectDays:0, perfectDayCountedDate:null,
    sRankDone:0, pomoGoalHitCount:0, nightOwl:false, lifetimeXP:0,
    xpBySkill:{}, xpByHour:Array(24).fill(0),
  },
  achievements: {},
  firstUseDate: null,
  workouts: {
    skill: 'force', xpPerMinute: 1.3,
    types: ['Musculation','Cardio','Course à pied','Football','Natation','Étirements','Autre'],
    log: [],
  },
  commitment: {forDate:null, taskIds:[], promptDismissedDate:null, eveningNotifiedDate:null, morningNotifiedDate:null},
  oath: {displayName:'', text:''},
});

let STATE = null;
let saveTimer = null;
let currentTab = 'today';
let achievementsFilter = 'all';
let pendingThemeNotice = false;
let modalSubtasks = [];
let expandedSubtasks = new Set();
let calendarMonthOffset = 0;

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function tomorrowStr(){ const d=new Date(); d.setDate(d.getDate()+1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function periodKey(freqTag, dateObj){
  const d = dateObj || new Date();
  if(freqTag==='hebdomadaire'){
    const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (tmp.getUTCDay()+6)%7;
    tmp.setUTCDate(tmp.getUTCDate()-dayNum+3);
    const firstThursday = new Date(Date.UTC(tmp.getUTCFullYear(),0,4));
    const week = 1 + Math.round(((tmp-firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
    return `${tmp.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
  }
  if(freqTag==='mensuelle'){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function previousPeriodKey(freqTag){
  const d = new Date();
  if(freqTag==='hebdomadaire'){ d.setDate(d.getDate()-7); return periodKey(freqTag, d); }
  if(freqTag==='mensuelle'){ d.setMonth(d.getMonth()-1); return periodKey(freqTag, d); }
  d.setDate(d.getDate()-1); return periodKey(freqTag, d);
}
function routineDone(r){ return r.lastDoneDate === periodKey(r.freqTag||'quotidienne'); }
function routineStreakAlive(r){
  const f = r.freqTag||'quotidienne';
  return r.lastDoneDate === periodKey(f) || r.lastDoneDate === previousPeriodKey(f);
}

async function loadState(){
  try{
    const raw = await storeGet(STORAGE_KEY);
    STATE = raw ? JSON.parse(raw) : DEFAULT_STATE();
  }catch(e){
    STATE = DEFAULT_STATE();
  }
  migrateState();
}

// Réévalue le changement de jour (routines, eau, pomodoro, pénalités, récap hebdo).
// Appelée au chargement ET à chaque retour au premier plan, pour ne pas rester
// bloquée sur l'état d'hier si l'app/onglet reste ouvert(e) à travers minuit.
function checkDayRollover(){
  const today = todayStr();
  const yesterday = yesterdayStr();
  if(!STATE.firstUseDate) STATE.firstUseDate = today;

  const pomoCompletedPrev = STATE.pomo.completedToday;
  const pomoGoalPrev = STATE.pomo.dailyGoal;
  const pomoDatePrev = STATE.pomo.lastPomoDate;
  if(STATE.pomo.lastPomoDate !== today){ STATE.pomo.completedToday = 0; STATE.pomo.dailyGoalRewarded = false; STATE.pomo.lastPomoDate = today; }

  // archive yesterday's stats into history when the day has rolled over
  if(STATE.todayStats.date !== today){
    if(STATE.todayStats.date){
      const histEntry = {
        date: STATE.todayStats.date,
        xpGained: STATE.todayStats.xpGained,
        waterMl: STATE.water.currentMl,
        routinesDone: STATE.todayStats.routinesDone,
        tasksDone: STATE.todayStats.tasksDone,
        goalsDone: STATE.todayStats.goalsDone,
        focusMinutes: STATE.todayStats.focusMinutes,
        tasksAbandoned: STATE.todayStats.tasksAbandoned||0,
        xpBySkill: STATE.todayStats.xpBySkill||{},
        level: STATE.hunterLevel,
        lifetimeXP: STATE.stats.lifetimeXP,
        waterGoalHit: STATE.water.currentMl >= STATE.water.goalMl,
      };
      if(!STATE.water.goalRewarded && STATE.settings.penaltiesEnabled && STATE.water.currentMl < STATE.water.goalMl){
        const penalty = Math.max(8, Math.round(STATE.water.xpOnGoal*0.75));
        const s = STATE.skills[STATE.water.skill];
        if(s) s.xp = Math.max(0, s.xp - penalty);
        histEntry.xpGained -= penalty;
        notifyIfEnabled('PÉNALITÉ // Hunter Log', `-${penalty} XP — Objectif hydratation raté`, 'hunter-log-penalty-water');
      }
      if(STATE.settings.penaltiesEnabled && STATE.settings.pomoPenaltyEnabled && pomoDatePrev === STATE.todayStats.date && pomoCompletedPrev < pomoGoalPrev){
        const penalty = Math.max(8, Math.round(pomoSessionXP()*0.75));
        const s = STATE.skills[STATE.pomo.skill];
        if(s) s.xp = Math.max(0, s.xp - penalty);
        histEntry.xpGained -= penalty;
        notifyIfEnabled('PÉNALITÉ // Hunter Log', `-${penalty} XP — Objectif pomodoro raté (${pomoCompletedPrev}/${pomoGoalPrev})`, 'hunter-log-penalty-pomo');
      }
      STATE.history.push(histEntry);
      if(STATE.history.length > HISTORY_MAX_DAYS) STATE.history = STATE.history.slice(-HISTORY_MAX_DAYS);
      showToast('SYSTEM', 'NOUVEAU JOUR — QUÊTES RÉINITIALISÉES', `Hier : ${histEntry.xpGained} XP · ${histEntry.routinesDone} routines · ${histEntry.tasksDone} tâches`);
    }
    STATE.todayStats = {date: today, xpGained:0, routinesDone:0, tasksDone:0, goalsDone:0, focusMinutes:0, tasksAbandoned:0, xpBySkill:{}};
  }

  // Récap hebdo : proposé une fois par semaine calendaire (ISO), à la première ouverture de l'app à partir du lundi (rattrapage si l'app n'a pas été ouverte le lundi).
  {
    const d = new Date(today+'T00:00:00');
    const isoDay = d.getDay()===0 ? 7 : d.getDay(); // lundi=1 ... dimanche=7
    const monday = new Date(d); monday.setDate(d.getDate()-(isoDay-1));
    const weekKey = `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
    if(STATE.lastWeeklyRecapShown !== weekKey){
      STATE.lastWeeklyRecapShown = weekKey;
      // Seulement s'il y a au moins un jour archivé à résumer. Avant : un tout nouveau
      // joueur voyait comme tout premier écran un « récap de la semaine » vide, par-dessus
      // le message de bienvenue.
      STATE.pendingWeeklyRecap = (STATE.history||[]).length > 0;
    }
  }

  // streak-break penalties (a routine that had momentum but missed its full period)
  // — si la pénalité de retard a déjà sanctionné cette même occurrence manquée,
  // on ne double pas la peine avec la pénalité de série rompue.
  STATE.routines.forEach(r=>{
    if(r.streak>0 && r.lastDoneDate && !routineStreakAlive(r) && r.lastPenaltyDate!==today){
      const alreadyPenalizedForMiss = r.deadlinePenalty && r.deadlinePenalizedDate && r.deadlinePenalizedDate !== today;
      if(!alreadyPenalizedForMiss) applyRoutinePenalty(r);
      r.streak = 0;
      r.lastPenaltyDate = today;
    }
  });

  if(STATE.water.lastDate !== today){ STATE.water.currentMl = 0; STATE.water.goalRewarded = false; STATE.water.lastDate = today; }
  checkRoutineDeadlines();
  refreshQuantifiedGoals();
  checkAchievements();
  queueSave();
  maybeAutoBackup();
}

function migrateState(){
  const d = DEFAULT_STATE();
  if(!STATE.pomo) STATE.pomo = d.pomo;
  if(STATE.pomo.dailyGoal===undefined) STATE.pomo.dailyGoal = 4;
  if(STATE.pomo.dailyGoalRewarded===undefined) STATE.pomo.dailyGoalRewarded = false;
  // Build 75 : l'XP pomodoro n'est plus réglable (anti-triche) → durée ramenée dans 10–90 min.
  delete STATE.pomo.xpPerSession;
  STATE.pomo.workMin = Math.min(POMO_MAX_WORK, Math.max(POMO_MIN_WORK, parseInt(STATE.pomo.workMin)||25));
  STATE.pomo.breakMin = Math.min(30, Math.max(1, parseInt(STATE.pomo.breakMin)||5));
  if(!STATE.pomo.combo) STATE.pomo.combo = {count:0, lastAt:0};
  if(!Array.isArray(STATE.pomo.log)) STATE.pomo.log = [];
  if(!STATE.goals) STATE.goals = [];
  if(!STATE.water) STATE.water = d.water;
  if(!STATE.settings) STATE.settings = d.settings;
  if(STATE.settings.notificationsOn===undefined) STATE.settings.notificationsOn = false;
  if(STATE.settings.pomoPenaltyEnabled===undefined) STATE.settings.pomoPenaltyEnabled = false;
  if(STATE.settings.identityTitlesEnabled===undefined) STATE.settings.identityTitlesEnabled = true;
  if(STATE.settings.fullHeaderEverywhere===undefined) STATE.settings.fullHeaderEverywhere = false;
  if(STATE.settings.visualTheme===undefined) STATE.settings.visualTheme = 'modern';
  if(STATE.settings.personalAvatar===undefined) STATE.settings.personalAvatar = false;
  // Build 76 : l'éveil n'est montré qu'aux nouveaux joueurs.
  if(STATE.settings.awakeningDone===undefined) STATE.settings.awakeningDone = (STATE.stats && STATE.stats.lifetimeXP||0) > 0;
  // Aperçu de la refonte « Monarque » : activée une seule fois pour les joueurs existants,
  // avec un message pour revenir en arrière (Réglages → Affichage). Jamais réimposée ensuite.
  if(!STATE.settings.monarchPreviewDone){
    STATE.settings.monarchPreviewDone = true;
    STATE.settings.visualTheme = 'monarch';
    pendingThemeNotice = true;
  }
  if(STATE.settings.welcomeDismissed===undefined) STATE.settings.welcomeDismissed = (STATE.stats && STATE.stats.lifetimeXP > 0);
  if(!STATE.todayStats) STATE.todayStats = {date: todayStr(), xpGained:0, routinesDone:0, tasksDone:0, goalsDone:0, focusMinutes:0, tasksAbandoned:0, xpBySkill:{}};
  if(STATE.todayStats.focusMinutes===undefined) STATE.todayStats.focusMinutes = 0;
  if(STATE.todayStats.tasksAbandoned===undefined) STATE.todayStats.tasksAbandoned = 0;
  if(!STATE.todayStats.xpBySkill) STATE.todayStats.xpBySkill = {};
  if(!STATE.history) STATE.history = [];
  STATE.history.forEach(h=>{ if(h.tasksAbandoned===undefined) h.tasksAbandoned = 0; if(!h.xpBySkill) h.xpBySkill = {}; if(h.focusMinutes===undefined) h.focusMinutes = 0; if(h.waterGoalHit===undefined) h.waterGoalHit = (h.waterMl!==undefined && STATE.water.goalMl!==undefined) ? h.waterMl >= STATE.water.goalMl : false; });
  if(!STATE.lastWeeklyRecapShown) STATE.lastWeeklyRecapShown = null;
  if(!STATE.stats) STATE.stats = d.stats;
  if(STATE.stats.lifetimeXP===undefined) STATE.stats.lifetimeXP = STATE.hunterXP||0;
  if(!STATE.stats.xpBySkill) STATE.stats.xpBySkill = {};
  if(!STATE.stats.xpByHour) STATE.stats.xpByHour = Array(24).fill(0);
  if(!STATE.achievements) STATE.achievements = {};
  if(!STATE.firstUseDate) STATE.firstUseDate = null;
  if(!STATE.workouts) STATE.workouts = d.workouts;
  if(!STATE.workouts.types || !STATE.workouts.types.length) STATE.workouts.types = d.workouts.types;
  if(!STATE.workouts.log) STATE.workouts.log = [];
  if(!STATE.commitment) STATE.commitment = {forDate:null, taskIds:[], promptDismissedDate:null, eveningNotifiedDate:null, morningNotifiedDate:null};
  if(!STATE.oath) STATE.oath = {displayName:'', text:''};
  if(STATE.commitment.promptDismissedDate===undefined) STATE.commitment.promptDismissedDate = null;
  if(STATE.commitment.eveningNotifiedDate===undefined) STATE.commitment.eveningNotifiedDate = null;
  if(STATE.commitment.morningNotifiedDate===undefined) STATE.commitment.morningNotifiedDate = null;
  if(!STATE.skills[STATE.workouts.skill]) STATE.workouts.skill = Object.keys(STATE.skills)[0];
  if(STATE.workouts.xpPerMinute === 1.5) STATE.workouts.xpPerMinute = 1.3;
  if(!STATE.skills[STATE.water.skill]) STATE.water.skill = Object.keys(STATE.skills)[0];
  STATE.routines.forEach(r=>{
    if(r.time === undefined) r.time = null;
    if(r.lastPenaltyDate === undefined) r.lastPenaltyDate = null;
    if(r.notifiedDate === undefined) r.notifiedDate = null;
    if(r.notifiedLateDate === undefined) r.notifiedLateDate = null;
    if(r.notifiedNowDate === undefined) r.notifiedNowDate = null;
    if(r.morning === undefined) r.morning = false;
    if(r.deadlinePenalty === undefined) r.deadlinePenalty = false;
    if(r.deadlinePenalizedDate === undefined) r.deadlinePenalizedDate = null;
    if(r.freqTag === undefined) r.freqTag = 'quotidienne';
  });
  STATE.tasks.forEach(t=>{
    if(t.time === undefined) t.time = null;
    if(t.priority === undefined) t.priority = 'moyenne';
    if(t.notifiedDate === undefined) t.notifiedDate = null;
    if(t.notifiedLateDate === undefined) t.notifiedLateDate = null;
    if(t.notifiedNowDate === undefined) t.notifiedNowDate = null;
    if(t.rank === undefined) t.rank = 'D';
    if(t.type === undefined) t.type = 'secondaire';
    if(t.dueDate === undefined) t.dueDate = null;
    if(t.timesCompleted === undefined) t.timesCompleted = 0;
    if(t.completedDate === undefined) t.completedDate = t.done ? 'inconnue' : null;
    if(t.subtasks === undefined) t.subtasks = [];
  });
  STATE.goals.forEach(g=>{
    if(g.priority === undefined) g.priority = 'moyenne';
    if(g.rank === undefined) g.rank = 'C';
    if(g.progressType === undefined) g.progressType = 'binaire';
    if(g.currentValue === undefined) g.currentValue = 0;
    if(g.targetValue === undefined) g.targetValue = null;
    if(g.unit === undefined) g.unit = '';
    if(g.linkedSource === undefined) g.linkedSource = 'manuel';
    if(g.linkedWorkoutType === undefined) g.linkedWorkoutType = null;
    if(g.createdDate === undefined) g.createdDate = STATE.firstUseDate || todayStr();
    if(g.subtasks === undefined) g.subtasks = [];
    if(g.progressPercent === undefined) g.progressPercent = 0;
  });
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ storeSet(STORAGE_KEY, JSON.stringify(STATE)); }, 250);
  queueSyncPush();
}
function flushSave(){
  // Force l'écriture immédiate en attente, pour ne pas perdre la dernière action
  // si l'app passe en arrière-plan ou se ferme juste avant la fin du debounce de 250ms.
  clearTimeout(saveTimer);
  storeSet(STORAGE_KEY, JSON.stringify(STATE));
  clearTimeout(syncPushTimer);
  flushSyncPushBeacon();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);

/* ========================= SYNCHRONISATION MULTI-APPAREILS ========================= */
// Le code de synchro et l'horodatage local sont volontairement stockés à part de STATE
// (pas dans le même objet que l'app synchronise) pour ne jamais s'écraser eux-mêmes
// quand on reçoit l'état d'un autre appareil.
const SYNC_CODE_KEY = STORAGE_KEY + '-sync-code';
const SYNC_TS_KEY = STORAGE_KEY + '-sync-ts';
let syncCode = null;
let localStateTs = 0;
let syncPushTimer = null;
let syncWatcherStarted = false;
let syncInFlight = false;
let lastSyncOkAt = 0; // dernière synchro réussie (push ou pull) pendant cette session

async function loadSyncMeta(){
  syncCode = await storeGet(SYNC_CODE_KEY);
  const ts = await storeGet(SYNC_TS_KEY);
  localStateTs = ts ? parseInt(ts, 10) || 0 : 0;
  try{ const b = await storeGet(SYNC_BASE_KEY); syncBase = b ? JSON.parse(b) : null; }catch(e){ syncBase = null; }
  adminSecret = (await storeGet(ADMIN_SECRET_KEY)) || null;
  if(syncCode) startSyncWatcher();
}
function randomSyncCode(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans caractères ambigus (0/O, 1/I...)
  let code = '';
  for(let i=0;i<8;i++) code += alphabet[Math.floor(Math.random()*alphabet.length)];
  return code;
}
// localStateTs = horodatage SERVEUR de la version dont descend l'état local (jamais l'horloge
// de l'appareil). syncDirty = il y a des changements locaux que le serveur n'a pas encore acceptés.
// Chaque envoi porte baseTs : si le serveur a reçu entre-temps une version plus récente (autre
// appareil), il refuse (409) au lieu d'écraser, et l'appareil charge cette version.
// C'était la cause du bug « j'allume le PC et il remet une vieille version par-dessus mes
// changements du téléphone » : au réveil, un minuteur (changement de jour, rappels…) enregistrait
// avant que la synchro ait récupéré la version du téléphone, et la vieille version gagnait.
let syncDirty = false, syncRev = 0;
const SYNC_BACKUP_KEY = STORAGE_KEY + '-sync-backup';
// Copie de la dernière version échangée avec le serveur : sert de point de départ commun pour
// fusionner quand les deux appareils ont changé des choses chacun de leur côté.
const SYNC_BASE_KEY = STORAGE_KEY + '-sync-base';
let syncBase = null;
function rememberSyncBase(state){ try{ syncBase = JSON.parse(JSON.stringify(state)); storeSet(SYNC_BASE_KEY, JSON.stringify(syncBase)); }catch(e){} }
const _same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const _isObj = x => x && typeof x === 'object' && !Array.isArray(x);
function _keyOf(x){ return _isObj(x) ? (x.id != null ? 'id:' + x.id : (x.date != null ? 'date:' + x.date : null)) : null; }
// Fusion à trois voies : pour chaque champ, on garde le côté qui a changé depuis la base commune.
// Si les deux ont changé la même valeur, c'est la version de CET appareil qui l'emporte.
// Les listes d'objets (quêtes, routines, objectifs, historique…) sont fusionnées élément par élément.
function mergeStates(base, local, server){
  if(_same(local, server)) return local;
  if(base !== undefined && _same(base, local)) return server;
  if(base !== undefined && _same(base, server)) return local;
  if(_isObj(local) && _isObj(server)){
    const b = _isObj(base) ? base : {}, out = {};
    for(const k of new Set([...Object.keys(server), ...Object.keys(local)])){
      const inL = k in local, inS = k in server, inB = k in b;
      if(inL && inS) out[k] = mergeStates(inB ? b[k] : undefined, local[k], server[k]);
      else if(inL){ if(!inB || !_same(b[k], local[k])) out[k] = local[k]; }
      else { if(!inB || !_same(b[k], server[k])) out[k] = server[k]; }
    }
    return out;
  }
  if(Array.isArray(local) && Array.isArray(server) && local.length + server.length > 0 && [...local, ...server].every(x => _keyOf(x))){
    const bm = new Map((Array.isArray(base) ? base : []).filter(_keyOf).map(x => [_keyOf(x), x]));
    const lm = new Map(local.map(x => [_keyOf(x), x])), sm = new Map(server.map(x => [_keyOf(x), x]));
    const order = [...server.map(_keyOf), ...local.map(_keyOf).filter(k => !sm.has(k))];
    const out = [];
    for(const k of order){
      const l = lm.get(k), sv = sm.get(k), bs = bm.get(k);
      if(l && sv) out.push(mergeStates(bs, l, sv));
      else if(l){ if(!bs || !_same(bs, l)) out.push(l); }       // supprimé sur l'autre appareil et pas modifié ici → supprimé
      else if(sv){ if(!bs || !_same(bs, sv)) out.push(sv); }
    }
    if(out.length && out[0].date && !out[0].id) out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
    return out;
  }
  return local;
}
function queueSyncPush(immediate){
  if(!syncCode) return;
  syncDirty = true; syncRev++;
  clearTimeout(syncPushTimer);
  if(immediate){ pushStateToServer(); return; }
  syncPushTimer = setTimeout(pushStateToServer, 1500);
}
async function pushStateToServer(){
  if(!syncCode) return;
  try{
    const rev = syncRev;
    const sentBody = JSON.stringify({code: syncCode, state: STATE, baseTs: localStateTs});
    const res = await fetch('/.netlify/functions/sync-state', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: sentBody,
    });
    if(res.status === 403){ handleAccessRevoked(await syncErrorCode(res)); return; }
    if(res.status === 409){
      lastSyncOkAt = Date.now();
      const data = await res.json().catch(()=>null);
      if(data && data.state && data.updatedAt) await adoptServerState(data.state, data.updatedAt, true);
      return;
    }
    if(res.ok){
      if(rev === syncRev) syncDirty = false;
      rememberSyncBase(JSON.parse(sentBody).state);
      lastSyncOkAt = Date.now();
      const data = await res.json();
      // On adopte l'horodatage renvoyé par le SERVEUR (jamais l'horloge locale) comme
      // référence de "dernière version connue" — évite tout biais dû à une horloge
      // d'appareil mal réglée.
      if(data && data.updatedAt){
        localStateTs = data.updatedAt;
        storeSet(SYNC_TS_KEY, String(localStateTs));
      }
    }
  }catch(e){ /* pas grave, le prochain push (ou pull sur l'autre appareil) rattrapera */ }
}
// À utiliser uniquement quand la page est en train de se cacher/fermer (verrouillage du
// téléphone, changement d'app, fermeture d'onglet) : un fetch() classique lancé à ce moment
// peut être coupé net par l'OS avant d'aboutir, alors qu'un ordinateur qui reste ouvert n'a
// jamais ce problème — c'est ce qui faisait paraître "l'ordinateur toujours prioritaire".
// sendBeacon est justement conçu pour survivre à la fermeture de la page (mais ne permet
// pas de lire la réponse : le vrai horodatage serveur ne sera récupéré qu'au prochain pull).
function flushSyncPushBeacon(){
  if(!syncCode) return;
  const payload = JSON.stringify({code: syncCode, state: STATE, baseTs: localStateTs});
  try{
    if(navigator.sendBeacon){
      const blob = new Blob([payload], {type:'application/json'});
      if(navigator.sendBeacon('/.netlify/functions/sync-state', blob)) return;
    }
  }catch(e){ /* on retente en fetch classique ci-dessous */ }
  fetch('/.netlify/functions/sync-state', {method:'POST', headers:{'Content-Type':'application/json'}, body: payload, keepalive:true}).catch(()=>{});
}
async function pullStateFromServer(){
  if(!syncCode || syncInFlight) return;
  syncInFlight = true;
  try{
    const res = await fetch(`/.netlify/functions/sync-state?code=${encodeURIComponent(syncCode)}`);
    if(res.status === 403){ handleAccessRevoked(await syncErrorCode(res)); syncInFlight = false; return; }
    if(res.ok || res.status === 404) lastSyncOkAt = Date.now();
    if(res.ok){
      const data = await res.json();
      if(data && data.updatedAt > localStateTs && data.state){
        await adoptServerState(data.state, data.updatedAt, syncDirty);
      }
    }
  }catch(e){ /* offline ou fonction indisponible : réessaiera au prochain tick */ }
  syncInFlight = false;
}
// Charge la version du serveur (plus récente, venue d'un autre appareil). Si cet appareil avait
// des changements pas encore envoyés, ils sont gardés à part (SYNC_BACKUP_KEY) au lieu d'être perdus.
async function adoptServerState(state, ts, hadLocalChanges){
  clearTimeout(syncPushTimer);
  let merged = state;
  if(hadLocalChanges){
    // Les deux appareils ont changé des choses : on fusionne au lieu de jeter l'un des deux.
    try{ await storeSet(SYNC_BACKUP_KEY, JSON.stringify({savedAt: Date.now(), state: STATE})); }catch(e){}
    // sans base connue (premier conflit après la mise à jour) : la version du serveur l'emporte
    if(syncBase !== null){ try{ merged = mergeStates(syncBase, STATE, state); }catch(e){ merged = state; } }
  }
  rememberSyncBase(state);
  STATE = merged;
  migrateState();
  localStateTs = ts; syncDirty = false;
  await storeSet(SYNC_TS_KEY, String(localStateTs));
  await storeSet(STORAGE_KEY, JSON.stringify(STATE));
  try{ checkDayRollover(); }catch(e){}
  if(hadLocalChanges && !_same(merged, state)) queueSyncPush();   // renvoie la fusion
  render();
}
// Appelé quand le serveur répond 403 (accès désactivé, ex: membre qui a arrêté de payer) —
// on arrête simplement d'essayer de synchroniser, sans effacer les données locales déjà là.
// `reason` : "disabled" (code désactivé par l'admin / abonnement annulé) ou "not_member"
// (code inconnu alors que la synchro est réservée aux membres — SYNC_MEMBERS_ONLY côté serveur).
let accessRevokedNotified = false;
async function syncErrorCode(res){
  try{ const d = await res.json(); return d && d.error; }catch(e){ return null; }
}
function handleAccessRevoked(reason){
  syncCode = null;
  storeSet(SYNC_CODE_KEY, '');
  renderSyncStatus();
  if(!accessRevokedNotified){
    accessRevokedNotified = true;
    if(reason === 'not_member') showToast('SYNCHRO RÉSERVÉE AUX MEMBRES', "Entre le code d'accès reçu à ton inscription", '', 'penalty');
    else showToast('SYNCHRO DÉSACTIVÉE', "Ce code a été désactivé", 'tes données restent sur cet appareil', 'penalty');
  }
}
function startSyncWatcher(){
  if(syncWatcherStarted) return;
  syncWatcherStarted = true;
  setInterval(pullStateFromServer, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pullStateFromServer(); });
  window.addEventListener('online', ()=> pullStateFromServer());
  window.addEventListener('pageshow', e => { if(e.persisted) pullStateFromServer(); });
}
async function generateSyncCode(){
  accessRevokedNotified = false;
  syncCode = randomSyncCode();
  await storeSet(SYNC_CODE_KEY, syncCode);
  localStateTs = Date.now();
  await storeSet(SYNC_TS_KEY, String(localStateTs));
  startSyncWatcher();
  await pushStateToServer();
  renderSyncStatus();
  showToast('SYNCHRO ACTIVÉE', syncCode, 'Entre ce code sur ton autre appareil');
}
async function joinSyncCode(){
  const input = document.getElementById('syncJoinInput');
  const code = (input.value || '').replace(/\s+/g,'').toUpperCase();
  if(!code){ return; }
  accessRevokedNotified = false;
  try{
    const res = await fetch(`/.netlify/functions/sync-state?code=${encodeURIComponent(code)}`);
    if(res.status === 404){
      // Code tout neuf (ex: donné à un nouveau membre) : rien à écraser, on démarre
      // simplement la synchro à partir de maintenant avec les données déjà sur cet appareil.
      syncCode = code;
      localStateTs = Date.now();
      await storeSet(SYNC_CODE_KEY, syncCode);
      await storeSet(SYNC_TS_KEY, String(localStateTs));
      startSyncWatcher();
      await pushStateToServer();
      renderSyncStatus();
      showToast('SYNCHRO ACTIVÉE', code, 'Nouveau code — synchro démarrée');
      return;
    }
    if(res.status === 403){
      const reason = await syncErrorCode(res);
      showToast(reason === 'not_member' ? 'CODE INCONNU' : 'CODE DÉSACTIVÉ',
        reason === 'not_member' ? "Vérifie la saisie, ou demande ton code d'accès" : "Ce code n'est plus actif (abonnement terminé ?)", '', 'penalty');
      return;
    }
    if(res.status === 400){ showToast('CODE INVALIDE', 'Lettres et chiffres uniquement, sans espace', '', 'penalty'); return; }
    if(!res.ok){
      showToast('ERREUR', 'Impossible de contacter le serveur de synchro', '', 'penalty');
      return;
    }
    if(!(await confirmModal("Remplacer les données de CET appareil par celles synchronisées sous ce code ? Vérifie d'abord que c'est bien ce que tu veux — action irréversible sur cet appareil.", {title:'REMPLACER LES DONNÉES LOCALES', confirmLabel:'Remplacer'}))) return;
    const data = await res.json();
    STATE = data.state;
    migrateState();
    syncCode = code;
    localStateTs = data.updatedAt;
    rememberSyncBase(STATE);
    await storeSet(SYNC_CODE_KEY, syncCode);
    await storeSet(SYNC_TS_KEY, String(localStateTs));
    await storeSet(STORAGE_KEY, JSON.stringify(STATE));
    startSyncWatcher();
    render();
    renderSyncStatus();
    showToast('SYNCHRONISÉ', 'Les deux appareils partagent maintenant la même sauvegarde');
  }catch(e){
    showToast('ERREUR', 'Impossible de contacter le serveur de synchro', '', 'penalty');
  }
}
// Génère un code à donner à un membre (ex: après son inscription payante sur Skool),
// SANS relier ce code à cet appareil — voir plus bas generateCodeForMember() (version admin).

// Les outils admin (codes membres) ne sont affichés que sur l'appareil de l'admin :
// ouvre l'app une fois avec ?admin à la fin de l'adresse, entre le mot de passe, et ils
// restent visibles sur cet appareil. Avant : visibles par tous les utilisateurs.
function isAdminDevice(){
  return !!adminSecret || /[?&]admin(=|&|$)/.test(location.search);
}
function lastSyncLabel(){
  if(!lastSyncOkAt) return 'pas encore confirmée depuis l\'ouverture';
  const min = Math.floor((Date.now() - lastSyncOkAt)/60000);
  if(min < 1) return 'à l\'instant';
  if(min < 60) return `il y a ${min} min`;
  return new Date(lastSyncOkAt).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
function syncStatusHtml(){

  `;
  const admin = isAdminDevice() ? `

  return `<div id="syncStatusBox">${branch}${admin}</div>`;

/* ---- Admin : registre des membres (codes émis à des clients payants) ---- */
const ADMIN_SECRET_KEY = STORAGE_KEY + '-admin-secret';
let adminSecret = null;
async function getAdminSecret(forcePrompt){
  if(!adminSecret) adminSecret = await storeGet(ADMIN_SECRET_KEY);
  if(!adminSecret || forcePrompt){
    const entered = prompt("Mot de passe admin (celui défini dans ADMIN_SECRET sur Netlify) :");
    if(!entered) return null;
    adminSecret = entered;
    await storeSet(ADMIN_SECRET_KEY, adminSecret);
  }
  return adminSecret;
}
async function membersApi(body){
  const secret = await getAdminSecret();
  if(!secret) return null;
  const res = await fetch('/.netlify/functions/members', {
    method: body ? 'POST' : 'GET',
    headers: {'Content-Type':'application/json', 'x-admin-secret': secret},
    body: body ? JSON.stringify(body) : undefined,
  });
  if(res.status === 401){
    adminSecret = null;
    await storeSet(ADMIN_SECRET_KEY, '');
    showToast('MOT DE PASSE INCORRECT', "Réessaie avec le bon mot de passe admin", '', 'penalty');
    return null;
  }
  if(res.status === 500){
    const err = await syncErrorCode(res.clone());
    if(err === 'admin_secret_not_configured'){
      showToast('ADMIN NON CONFIGURÉ', "Ajoute la variable ADMIN_SECRET sur Netlify", 'puis redéploie', 'penalty');
      return null;
    }
  }
  return res;
}

// Admin uniquement : envoie une notification à TOUS les membres abonnés pour ouvrir
// un nouveau cycle de Serments (ex: annonce faite en début de live).
async function launchOathEvent(){
  const secret = await getAdminSecret();
  if(!secret) return;
  const customMsg = prompt("Message de la notification :", "⚔️ Un Serment Inné est ouvert — définis ton prochain objectif !");
  if(customMsg === null) return;
  try{
    const res = await fetch('/.netlify/functions/broadcast', {
      method:'POST', headers:{'Content-Type':'application/json', 'x-admin-secret': secret},
      body: JSON.stringify({body: customMsg}),
    });
    if(res.status === 401){
      adminSecret = null;
      await storeSet(ADMIN_SECRET_KEY, '');
      showToast('MOT DE PASSE INCORRECT', '', '', 'penalty');
      return;
    }
    if(!res.ok){ showToast('ERREUR', "Échec de l'envoi", '', 'penalty'); return; }
    const data = await res.json();
    showToast('SERMENT LANCÉ', `${data.sent} notifié(s)`, data.failed ? `${data.failed} échec(s)` : '');
  }catch(e){
    showToast('ERREUR', 'Impossible de contacter le serveur', '', 'penalty');
  }
}

// Paliers narratifs basés sur le NIVEAU de la compétence (pas sur le nombre d'occurrences) —
// dans l'esprit "le System reconnaît ce que tu es devenu". Peut être masqué via les réglages.
const IDENTITY_TIERS = [
  {n:3,   label:'Novice'},
  {n:8,   label:'Pratiquant'},
  {n:15,  label:'Habitué'},
  {n:25,  label:'Adepte'},
  {n:40,  label:'Vétéran'},
  {n:60,  label:'Maître'},
  {n:100, label:'Légende'},
];
function identityTierFor(level){
  let best = null;
  IDENTITY_TIERS.forEach(t=>{ if(level >= t.n) best = t; });
  return best;
}
function identityNextTier(level){
  return IDENTITY_TIERS.find(t=> level < t.n) || null;
}
function checkAchievements(){
  let unlocked = false;
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achievements[a.id] && a.check(STATE)){

      showToast('SUCCÈS DÉBLOQUÉ', a.name, `Écusson ${achTier(a).label.toLowerCase()}`, 'reward');
      sfxReward();
    }

}
function updateBestStreak(){
  const maxStreak = Math.max(0, ...STATE.routines.map(r=>r.streak));
  if(maxStreak > STATE.stats.bestStreak) STATE.stats.bestStreak = maxStreak;
}
function checkPerfectDay(){
  const today = todayStr();

/* ========================= SOUND & HAPTICS ========================= */
let audioCtx = null;
function ensureAudio(){
  if(!STATE.settings.soundOn) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playTone(freq, duration, type, gainPeak, delay){
  const ctx = ensureAudio();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak||0.15, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+duration+0.02);
  }catch(e){ /* audio best-effort */ }
}
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* ignore */ } }
function sfxLevelUp(){ playTone(523.25,0.14,'triangle',0.18,0); playTone(659.25,0.14,'triangle',0.18,0.12); playTone(783.99,0.22,'triangle',0.2,0.24); vibrate([15,40,15]); }
function sfxTransform(){ playTone(392,0.16,'sawtooth',0.14,0); playTone(587.33,0.16,'sawtooth',0.14,0.14); playTone(880,0.28,'triangle',0.2,0.28); vibrate([20,60,20,60,40]); }

function sfxPenalty(){ playTone(220,0.18,'sawtooth',0.12,0); playTone(160,0.24,'sawtooth',0.12,0.1); vibrate([30,30,30]); }

// Vérifie les routines avec une heure limite + pénalité activée : si l'heure est
// dépassée et que la routine n'est pas encore validée sur sa période en cours,
// applique une pénalité une seule fois par jour.
function checkRoutineDeadlines(){
  if(!STATE) return;
  const today = todayStr();
  const hhmm = new Date().toTimeString().slice(0,5);
  let changed = false;
  STATE.routines.forEach(r=>{
    if(!r.time || !r.deadlinePenalty) return;
    if(routineDone(r)) return;
    if(hhmm < r.time) return;
    if(r.deadlinePenalizedDate === today) return;
    r.deadlinePenalizedDate = today;
    applyDeadlinePenalty(r);
    changed = true;
  });
  if(changed){ queueSave(); render(); }
}

const SUBTASK_XP_SHARE = 0.4; // part de l'XP totale de la quête partagée entre les sous-tâches ; le reste (60%) va au bonus de complétion
function subtaskXpSplit(t){
  // Répartit l'XP totale de la quête entre chaque sous-tâche + un bonus de complétion.
  // Seule une fraction (SUBTASK_XP_SHARE) de l'XP totale est répartie entre les sous-tâches ; le reste
  // (au moins 60% par défaut) est réservé au bonus final, pour que finir la quête rapporte toujours
  // nettement plus que chaque sous-tâche prise isolément (et souvent plus que toutes réunies).
  // Ex: 50 XP, 4 sous-tâches -> pool sous-tâches = 50*0.4 = 20 -> part = floor(20/4) = 5, bonus = 50 - 5*4 = 30.
  const n = (t.subtasks||[]).length;
  if(!n) return {perSub:0, bonus:t.xp};
  const perSub = Math.floor((t.xp * SUBTASK_XP_SHARE) / n);
  const bonus = t.xp - perSub*n;
  return {perSub, bonus};
}
function addSkillXP(key, amount, rewardText){
  const s = STATE.skills[key];
  if(!s) return;
  STATE.todayStats.xpGained += amount;
  STATE.todayStats.xpBySkill = STATE.todayStats.xpBySkill || {};
  STATE.todayStats.xpBySkill[key] = (STATE.todayStats.xpBySkill[key]||0) + amount;
  STATE.stats.lifetimeXP = Math.max(0, (STATE.stats.lifetimeXP||0) + amount);
  STATE.stats.xpBySkill[key] = Math.max(0, (STATE.stats.xpBySkill[key]||0) + amount);
  if(amount > 0){
    STATE.stats.xpByHour[new Date().getHours()] += amount;
  }
  s.xp += amount;
  if(s.xp < 0) s.xp = 0;
  const prevLevel = s.level;
  let levelsGained = 0;
  while(s.xp >= xpToNextSkill(s.level)){
    s.xp -= xpToNextSkill(s.level);
    s.level += 1;
    levelsGained++;
  }
  if(levelsGained>0){ showToast(s.name.toUpperCase(), `NIVEAU ${s.level}`); sfxLevelUp(); }
  if(levelsGained>0 && STATE.settings.identityTitlesEnabled){
    const prevTier = identityTierFor(prevLevel);
    const newTier = identityTierFor(s.level);
    if(newTier && (!prevTier || newTier.label !== prevTier.label)){
      showToast('LE SYSTEM RECONNAÎT', `${newTier.label} en ${s.name}`, `Niveau ${s.level}`, 'reward');
      sfxReward();
    }
  }

  const prevRank = rankForLevel(STATE.hunterLevel).label;
  STATE.hunterXP += amount;
  if(STATE.hunterXP < 0) STATE.hunterXP = 0;
  let hLevels = 0;
  while(STATE.hunterXP >= xpToNextHunter(STATE.hunterLevel)){
    STATE.hunterXP -= xpToNextHunter(STATE.hunterLevel);
    STATE.hunterLevel += 1;
    hLevels++;
  }
  const newRank = rankForLevel(STATE.hunterLevel).label;
  if(hLevels>0 && newRank===prevRank){ showToast('HUNTER LEVEL UP', `NIVEAU ${STATE.hunterLevel}`); sfxLevelUp(); }
  if(newRank !== prevRank){
    if(rankOrderIdx(newRank) > rankOrderIdx(prevRank)){ showRankUp(prevRank, newRank, rankForLevel(STATE.hunterLevel).color); }
    else { showToast('RANG PERDU', `RANG ${newRank}`, '', 'penalty'); }
    sfxTransform();
  }
  if(rewardText){ showToast('RÉCOMPENSE', rewardText); sfxReward(); }

  checkAchievements();
  queueSave();
  render();
  if(amount > 0) xpFloat(amount, s.name);
}

/* « +20 XP » qui s'envole depuis l'endroit où l'on vient de toucher (build 76). */
let lastTapPoint = null, lastXpFloatAt = 0, xpFloatStack = 0;
document.addEventListener('pointerdown', e=>{ lastTapPoint = {x:e.clientX, y:e.clientY, t:Date.now()}; }, true);
function xpFloat(amount, skillName){
  try{
    const now = Date.now();
    const p = (lastTapPoint && now - lastTapPoint.t < 1500) ? lastTapPoint : {x: window.innerWidth/2, y: window.innerHeight*0.42};
    xpFloatStack = (now - lastXpFloatAt < 450) ? xpFloatStack + 1 : 0;
    lastXpFloatAt = now;
    const el = document.createElement('div');
    el.className = 'xp-float';
    el.innerHTML = `<b>+${amount} XP</b>${skillName ? `<span>${escapeHtml(String(skillName).toUpperCase())}</span>` : ''}`;
    const x = Math.min(Math.max(p.x, 95), window.innerWidth - 95);
    el.style.left = x + 'px';
    el.style.top = (p.y - 20 - xpFloatStack*44) + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1300);
  }catch(e){ /* purement visuel */ }
}

    </div>`;
  const DUR = Math.min(7000, 2500 + target*120);
  let lastRank = null;
  const t0 = performance.now();
  const step = (now)=>{
    const p = Math.min(1, (now - t0) / DUR);
    const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    const lvl = Math.max(1, Math.round(1 + (target-1)*e));

    document.getElementById('rpFill').style.width = (e*100).toFixed(1) + '%';
    if(r.label !== lastRank){
      document.getElementById('rpBadge').innerHTML = buildRankBadge(r.label, 160);
      const cfg = AVATAR_CONFIG[r.label] || AVATAR_CONFIG.E;
      const rr = document.getElementById('rpRank'); rr.textContent = `RANG ${r.label} · ${cfg.title.toUpperCase()}`; rr.style.color = r.color;

    if(p < 1) replayRaf = requestAnimationFrame(step);
    else { document.getElementById('rpActions').classList.add('show'); if(STATE.settings.soundOn) sfxLevelUp(); }
  };
  replayRaf = requestAnimationFrame(step);

/* ---------- Carte de chasseur (image 1080×1920 à partager) ---------- */
function svgToImage(svgEl, w, h){
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', w); clone.setAttribute('height', h);
  clone.removeAttribute('style');
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  return new Promise((res)=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>res(null); im.src = src; });
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  const rg = ctx.createRadialGradient(W/2, 640, 40, W/2, 640, 620); rg.addColorStop(0, accent + '55'); rg.addColorStop(1, 'transparent');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);

  skills.forEach(s=>{
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = `600 26px ${sans}`; ctx.fillText(s.name.toUpperCase().slice(0,14), 110, ky + 22);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; roundRect(ctx, 400, ky, 480, 26, 13); ctx.fill();
    ctx.fillStyle = accent; roundRect(ctx, 400, ky, Math.max(26, 480*s.level/maxL), 26, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `700 26px ${sans}`; ctx.textAlign = 'right'; ctx.fillText('NIV ' + s.level, 970, ky + 22); ctx.textAlign = 'left';
    ky += 50;
  });
  ctx.textAlign = 'center';
  // serment
  if(STATE.oath && STATE.oath.text){
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = `italic 400 30px ${sans}`;
    const words = ('« ' + STATE.oath.text + ' »').split(' '); let line = '', lines = [];
    words.forEach(w=>{ const t = line ? line + ' ' + w : w; if(ctx.measureText(t).width > 860){ lines.push(line); line = w; } else line = t; });
    lines.push(line);
    lines.slice(0,2).forEach((l,i)=>ctx.fillText(l, W/2, ky + 50 + i*42));
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = `600 26px ${sans}`;
  ctx.fillText(location.host ? `Rejoins la chasse · ${location.host}` : 'Rejoins la chasse · ZENKAI', W/2, H - 90);
  return cv;
}
let hunterCardBlob = null;
async function openHunterCard(){
  openModal(`<h3>CARTE DE CHASSEUR</h3><div class="card-preview" id="cardPreview"><div class="card-loading">Génération…</div></div>

  try{

function downloadHunterCard(){

  try{ await navigator.share({files:[file], title:'Ma carte de chasseur', text:`Rang ${rankForLevel(STATE.hunterLevel).label} · niveau ${STATE.hunterLevel} sur ZENKAI`}); }

/* ========================= RANK-UP CINEMATIC ========================= */
let rankUpTimer = null;
function showRankUp(oldLabel, newLabel, color){
  const el = document.getElementById('rankUp');
  if(!el) return;
  clearTimeout(rankUpTimer);
  el.classList.remove('out');
  el.style.setProperty('--rc', color);
  let parts = '';
  for(let i=0;i<36;i++){
    const a = Math.random()*Math.PI*2, d = 120 + Math.random()*260;
    parts += `<i class="ru-p" style="--x:${Math.round(Math.cos(a)*d)}px;--y:${Math.round(Math.sin(a)*d)}px;--s:${3+Math.round(Math.random()*5)}px;--d:${(0.55+Math.random()*0.35).toFixed(2)}s"></i>`;
  }
  el.innerHTML = `
    <div class="ru-glow"></div><div class="ru-rays"></div>
    <div class="ru-ring r1"></div><div class="ru-ring r2"></div><div class="ru-ring r3"></div>
    ${parts}
    <div class="ru-stage">
      <div class="ru-top">— SYSTEM —</div>
      <div class="ru-letters"><div class="ru-old">${escapeHtml(oldLabel)}</div><div class="ru-new">${escapeHtml(newLabel)}</div></div>
      <div class="ru-title">TRANSFORMATION</div>
      <div class="ru-sub">RANG ${escapeHtml(oldLabel)} → RANG ${escapeHtml(newLabel)}</div>
      <div class="ru-hint">TOUCHE POUR CONTINUER</div>
    </div>`;
  el.classList.add('on');

}
function closeRankUp(){
  const el = document.getElementById('rankUp');
  if(!el || !el.classList.contains('on') || el.classList.contains('out')) return;
  clearTimeout(rankUpTimer);
  el.classList.add('out');
  setTimeout(()=>{ el.classList.remove('on','out'); el.innerHTML=''; }, 600);
}


/* ========================= QUEST COMPLETE BURST ========================= */
function questBurst(el){
  const r = el.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  const frag = document.createDocumentFragment();
  const ring = document.createElement('div');
  ring.className = 'qb-ring'; ring.style.left = x+'px'; ring.style.top = y+'px';
  frag.appendChild(ring);
  const cols = ['var(--cyan)','var(--gold)','#fff'];
  for(let i=0;i<9;i++){
    const a = (Math.PI*2*i/9) + Math.random()*0.5, d = 22 + Math.random()*22;
    const p = document.createElement('i');
    p.className = 'qb-p'; p.style.left = x+'px'; p.style.top = y+'px';
    p.style.setProperty('--x', Math.round(Math.cos(a)*d)+'px');
    p.style.setProperty('--y', Math.round(Math.sin(a)*d)+'px');
    p.style.setProperty('--c', cols[i%3]);
    frag.appendChild(p);
  }
  document.body.appendChild(frag);
  setTimeout(()=>{ document.querySelectorAll('.qb-ring,.qb-p').forEach(n=>n.remove()); }, 600);
}
document.addEventListener('click', e=>{
  const c = e.target.closest && e.target.closest('.chk');
  if(!c || c.classList.contains('done') || !c.hasAttribute('onclick')) return;
  questBurst(c);
}, true);

function showToast(top, main, sub, variant){
  const zone = document.getElementById('toastZone');
  const el = document.createElement('div');
  el.className = 'toast' + (variant==='penalty' ? ' toast-penalty' : '');
  el.innerHTML = `<div class="tt">${escapeHtml(top)}</div><div class="tn">${escapeHtml(main)}</div>${sub?`<div class="tr">${escapeHtml(sub)}</div>`:''}`;
  zone.appendChild(el);
  setTimeout(()=> el.remove(), 3400);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========================= RADAR CHART ========================= */
function buildRadar(skills){
  const keys = Object.keys(skills);
  const n = keys.length;
  if(n < 3) return '<div class="empty">AJOUTE AU MOINS 3 COMPÉTENCES POUR AFFICHER LE RADAR</div>';
  const size = 300, cx = size/2, cy = size/2, R = 108;
  const maxLevel = Math.max(10, ...keys.map(k=>skills[k].level));
  const roundedMax = Math.ceil(maxLevel/5)*5;
  const angleFor = i => (-Math.PI/2) + i*(2*Math.PI/n);

  let grid = '';
  [0.25,0.5,0.75,1].forEach(f=>{
    let pts = [];
    for(let i=0;i<n;i++){ const a = angleFor(i); pts.push(`${cx+Math.cos(a)*R*f},${cy+Math.sin(a)*R*f}`); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="#1b2942" stroke-width="1"/>`;
  });

  let axes = '', labels = '';
  let dataPts = [];
  keys.forEach((k,i)=>{
    const a = angleFor(i);
    const x2 = cx+Math.cos(a)*R, y2 = cy+Math.sin(a)*R;
    axes += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#1b2942" stroke-width="1"/>`;
    const lx = cx+Math.cos(a)*(R+26), ly = cy+Math.sin(a)*(R+26);
    const anchor = Math.abs(Math.cos(a))<0.3 ? 'middle' : (Math.cos(a)>0 ? 'start' : 'end');
    // Nom tronqué à 14 caractères : au-delà, il sortait du cadre (ex. « DISCIPLINE » affiché « LINE »).
    const rawName = skills[k].name.toUpperCase();
    const shortName = rawName.length > 14 ? rawName.slice(0,13) + '…' : rawName;
    labels += `<text x="${lx}" y="${ly}" fill="#8fa3c4" font-family="Space Mono, monospace" font-size="10" text-anchor="${anchor}" dominant-baseline="middle">${escapeHtml(shortName)}</text>`;
    labels += `<text x="${lx}" y="${ly+12}" fill="#22e5ff" font-family="Rajdhani, sans-serif" font-size="11" font-weight="700" text-anchor="${anchor}" dominant-baseline="middle">LV ${skills[k].level}</text>`;
    const r = (skills[k].level/roundedMax)*R;
    dataPts.push(`${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`);
  });

  const dataPoly = `<polygon points="${dataPts.join(' ')}" fill="rgba(34,229,255,0.18)" stroke="#22e5ff" stroke-width="2" style="filter:drop-shadow(0 0 6px rgba(34,229,255,0.6))"/>`;
  const dots = keys.map((k,i)=>{
    const a = angleFor(i);
    const r = (skills[k].level/roundedMax)*R;
    return `<circle cx="${cx+Math.cos(a)*r}" cy="${cy+Math.sin(a)*r}" r="3.5" fill="#22e5ff"/>`;
  }).join('');

  // Marge de 75 px de chaque côté : les libellés à gauche/droite (ancrés en fin/début de
  // texte) débordaient du viewBox de 300 px et étaient coupés par le bord du SVG.
  return `<svg viewBox="-75 0 ${size+150} ${size+20}" width="100%" style="max-width:420px">
    <g transform="translate(0,10)">${grid}${axes}${dataPoly}${dots}${labels}</g>
  </svg>`;
}

/* ========================= EVOLVING RANK SIGIL (abstract emblem, no figure, tied to rank) ========================= */
const AVATAR_CONFIG = {
  E: {hair:'#4a6a9a', aura1:'#2fb8ff', aura2:'#0d3a5c', particles:0, lightning:false, cape:false, title:'Novice'},
  D: {hair:'#3ddc84', aura1:'#3ddc84', aura2:'#0d3a2a', particles:3, lightning:false, cape:false, title:'Éveillé'},
  C: {hair:'#22e5ff', aura1:'#22e5ff', aura2:'#0d3a5c', particles:5, lightning:false, cape:false, title:'Aguerri'},
  B: {hair:'#9b6bff', aura1:'#9b6bff', aura2:'#2a1a4a', particles:7, lightning:false, cape:true,  title:'Élite'},
  A: {hair:'#ff6b9d', aura1:'#ff6b9d', aura2:'#3a1626', particles:9, lightning:true,  cape:true,  title:'Supérieur'},
  S: {hair:'#ffe066', aura1:'#ffe066', aura2:'#3a2f0a', particles:12,lightning:true,  cape:true,  title:'Monarque'},
};

// Sceau géométrique (hexagone + anneaux + nœuds) qui remplace l'ancien avatar illustré : aucune
// figure humaine, uniquement des formes et de la lumière. La complexité (nombre d'anneaux, de
// nœuds, ailerons latéraux) augmente avec le rang — même logique de progression visuelle
// qu'avant, sans personnage. Remplace l'ancien buildAvatar() basé sur AVATAR_IMAGES (6 images
// ~1,3 Mo au total en base64, supprimées avec ce correctif — l'app est plus légère aussi).
function buildSigil(rankLabel, cfg){
  const TIERS = ['E','D','C','B','A','S'];
  const tier = TIERS.indexOf(rankLabel);
  const cx = 100, cy = 108, R = 66;
  const hex = (r, rot=0) => {
    const pts = [];
    for(let i=0;i<6;i++){
      const a = (Math.PI/3)*i + rot - Math.PI/2;
      pts.push(`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`);
    }
    return pts.join(' ');
  };
  let rings = '';
  const ringCount = Math.min(tier+1, 6);
  for(let i=0;i<ringCount;i++){
    const r = R - i*8;
    const rot = (i%2===0) ? 0 : Math.PI/6;
    rings += `<polygon points="${hex(r, rot)}" fill="none" stroke="${cfg.aura1}" stroke-width="${i===0?2.6:1.2}" opacity="${(0.9-i*0.12).toFixed(2)}"/>`;
  }
  let nodes = '';
  for(let i=0;i<cfg.particles;i++){
    const a = (Math.PI*2/Math.max(cfg.particles,1))*i - Math.PI/2;
    const x = cx+Math.cos(a)*(R+10), y = cy+Math.sin(a)*(R+10);
    nodes += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${cfg.aura1}" style="filter:drop-shadow(0 0 4px ${cfg.aura1})"/>`;
  }
  const flares = cfg.cape ? `
    <path d="M${(cx-R*0.5).toFixed(1)},${(cy-R*0.95).toFixed(1)} L${(cx-R*1.05).toFixed(1)},${(cy-R*0.25).toFixed(1)} L${(cx-R*0.62).toFixed(1)},${(cy-R*0.1).toFixed(1)} Z" fill="${cfg.aura1}" opacity="0.5"/>
    <path d="M${(cx+R*0.5).toFixed(1)},${(cy-R*0.95).toFixed(1)} L${(cx+R*1.05).toFixed(1)},${(cy-R*0.25).toFixed(1)} L${(cx+R*0.62).toFixed(1)},${(cy-R*0.1).toFixed(1)} Z" fill="${cfg.aura1}" opacity="0.5"/>` : '';
  const letterSize = 44 + tier*4;
  return `<svg viewBox="0 0 200 235" style="position:relative; display:block; width:100%; height:100%;">
    ${flares}
    ${rings}
    <polygon points="${hex(R,0)}" fill="${cfg.aura2}" opacity="0.4"/>
    ${nodes}
    <text x="${cx}" y="${(cy+letterSize*0.34).toFixed(1)}" text-anchor="middle" font-family="Rajdhani, sans-serif" font-weight="700" font-size="${letterSize}" fill="${cfg.aura1}" style="filter:drop-shadow(0 0 6px ${cfg.aura1})">${rankLabel}</text>
  </svg>`;
}
function buildAvatar(rankLabel){
  const cfg = AVATAR_CONFIG[rankLabel];

  let particles = '';
  for(let i=0;i<cfg.particles;i++){
    const angle = (i/cfg.particles)*360;
    const dist = 40 + (i%3)*7;
    const size = 4 + (i%3)*2;
    particles += `<div class="particle" style="position:absolute; left:50%; top:58%; width:${size}px; height:${size}px; border-radius:50%; background:${cfg.aura1}; opacity:.75; box-shadow:0 0 6px ${cfg.aura1}; transform:translate(-50%,-50%) rotate(${angle.toFixed(1)}deg) translate(${dist}%) rotate(${(-angle).toFixed(1)}deg); animation-delay:${(i*0.15).toFixed(2)}s;"></div>`;
  }

  let lightning = '';
  if(cfg.lightning){
    lightning = `<svg viewBox="0 0 200 235" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;">
      <path d="M20,100 L34,118 L26,120 L40,145" stroke="${cfg.aura1}" stroke-width="2.4" fill="none" opacity="0.85" stroke-linejoin="round"/>
      <path d="M180,95 L166,115 L174,117 L158,142" stroke="${cfg.aura1}" stroke-width="2.4" fill="none" opacity="0.85" stroke-linejoin="round"/>
    </svg>`;
  }

  return `<div style="position:relative; width:100%; max-width:180px; aspect-ratio:200/235; margin:0 auto;">
    <div class="aura-ring" style="position:absolute; inset:-12%; border-radius:50%; background:radial-gradient(circle, ${cfg.aura1}4D, transparent 70%);"></div>
    <div class="aura-ring" style="position:absolute; inset:14%; border-radius:50%; border:1px solid ${cfg.aura1}; opacity:.35;"></div>
    ${particles}
    ${lightning}
    ${buildSigil(rankLabel, cfg)}
  </div>`;
}

/* ========================= EN-TÊTES PROPRES À CHAQUE STYLE =========================
   Chaque nouveau style a sa propre mise en page d'en-tête (reprise des maquettes), pas
   seulement d'autres couleurs : Monarque = portrait + puces ; Système = fenêtre de statut
   clé/valeur ; Manhwa = case de BD + étoile de rang ; Donjon = portrait en arche + sceau
   de cire ; Épuré = salutation + anneau d'XP + 3 grands chiffres. Les styles Système ·
   Moderne et Système · Classique gardent l'en-tête d'origine (retourne null). */
/* Module de rang de l'en-tête (build 76) : un anneau en 6 segments, un par rang (E → S).
   Les rangs passés sont pleins dans leur couleur, le rang en cours se remplit selon les
   niveaux déjà faits, les suivants restent en creux. Au centre la lettre, dessous le
   prochain palier (« B dans 8 niv. ») : on voit d'un coup d'œil où on en est et ce qu'il reste. */
function rankProgress(lvl){
  const cur = rankForLevel(lvl);
  const idx = RANK_ORDER.indexOf(cur.label);
  if(idx >= RANK_ORDER.length-1) return {cur, idx, next:null, left:0, p:1};
  const next = RANK_ORDER[idx+1];
  const a = RANK_THRESHOLDS[cur.label], b = RANK_THRESHOLDS[next];
  return {cur, idx, next, left: b - lvl, p: Math.max(0, Math.min(1, (lvl - a) / (b - a)))};
}
function rankRingHtml(lvl, size, withNext){
  const rp = rankProgress(lvl);
  const R = 40, C = 2*Math.PI*R, seg = C/6, gap = 7;
  const arcs = RANK_ORDER.map((L, i)=>{
    const col = rankForLevel(RANK_THRESHOLDS[L]).color;
    const rot = -90 + i*60 + (gap/C*360)/2;
    const len = seg - gap;
    const track = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="7" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" transform="rotate(${rot.toFixed(2)} 50 50)"/>`;
    const fill = i < rp.idx ? 1 : i === rp.idx ? Math.max(0.06, rp.p) : 0;
    const f = fill ? `<circle class="${i===rp.idx?'rk-cur':''}" cx="50" cy="50" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="butt" stroke-dasharray="${(len*fill).toFixed(2)} ${C.toFixed(2)}" transform="rotate(${rot.toFixed(2)} 50 50)" style="color:${col};"/>` : '';
    return track + f;
  }).join('');
  const nextCol = rp.next ? rankForLevel(RANK_THRESHOLDS[rp.next]).color : rp.cur.color;
  return `<div class="rk" style="--rc:${rp.cur.color}; --nc:${nextCol}; --rs:${size}px;" aria-label="Rang ${rp.cur.label}${rp.next ? `, rang ${rp.next} dans ${rp.left} niveaux` : ''}">
    <div class="rk-ring"><svg viewBox="0 0 100 100" aria-hidden="true">${arcs}</svg>
      <div class="rk-mid"><span class="rk-lab">RANG</span><span class="rk-letter">${rp.cur.label}</span></div></div>
    ${withNext ? `<div class="rk-next">${rp.next ? `<b>${rp.next}</b> dans ${rp.left} niv.` : '<b>RANG MAX</b>'}</div>` : ''}
  </div>`;
}

/* ========================= POMODORO ========================= */
let pomoRunning = false;
let pomoMode = 'work';
let pomoRemaining = 0;
let pomoInterval = null;
let pomoEndAt = null;   // timestamp (ms) auquel la session en cours doit se terminer
let pomoWakeLock = null; // référence au Wake Lock actif
let pomoLinkedTaskId = null; // quête à laquelle la session en cours est liée (XP + temps de focus redirigés dessus)
function startPomoForTask(taskId){
  pomoLinkedTaskId = taskId;
  const t = STATE.tasks.find(x=>x.id===taskId);
  if(t) pomoIntent = t.name.slice(0, 80);
  pomoPersist();
  // switchTab (et pas seulement currentTab) : remonte en haut de page. Sinon, lancé depuis le
  // bas d'une longue liste de quêtes, l'écran restait plus bas que le minuteur → page vide.
  switchTab('pomodoro');
  window.scrollTo(0, 0);
}
function unlinkPomoTask(){
  const t = pomoLinkedTaskId ? STATE.tasks.find(x=>x.id===pomoLinkedTaskId) : null;
  if(t && pomoIntent === t.name.slice(0, 80) && !(pomoRunning && pomoMode==='work')) pomoIntent = '';
  pomoLinkedTaskId = null;
  pomoPersist();
  render();
}

/* ---- XP : fixe, proportionnelle à la durée (anti-triche) ----
   Avant : « XP/session » réglable jusqu'à 500 et focus réglable dès 1 min → des milliers
   d'XP en quelques minutes. Désormais 0,8 XP par minute de focus (25 min = 20 XP,
   comme avant par défaut) et une session dure au moins 10 min. */
function pomoSessionXP(){ return Math.max(1, Math.round(STATE.pomo.workMin * POMO_XP_PER_MIN)); }

/* ---- Combo de focus ----
   Chaque session terminée peu après la précédente (pause + 15 min de marge) fait monter
   le combo : XP ×1,1 au 2e, ×1,2 au 3e… jusqu'à ×1,5. Abandonner une session entamée
   (RESET après plus d'une minute) remet le combo à zéro, sans autre pénalité. */
function pomoComboMult(count){ return count > 1 ? Math.min(1.5, 1 + 0.1*(count-1)) : 1; }
function pomoComboAlive(){
  const c = STATE.pomo.combo;
  if(!c || !c.count || !c.lastAt) return false;
  return Date.now() - c.lastAt <= (STATE.pomo.workMin + STATE.pomo.breakMin + 15) * 60000 || (pomoRunning && pomoMode==='work');
}

let pomoIntent = '';          // ce que l'utilisateur compte faire pendant la session (optionnel)
let pomoReview = null;        // {intent} : session terminée, en attente de « fait / à moitié / pas fait »
let pomoFocusMode = false;    // affichage plein écran

function pomoInit(){ pomoRemaining = STATE.pomo.workMin*60; }

/* ---- Minuteur conservé si l'app est fermée ----
   Avant : fermer l'app (ou le téléphone qui la tue en arrière-plan) effaçait la session en
   cours — pas d'XP, alors que la notification de fin arrivait quand même. L'état du minuteur
   est gardé sur l'appareil ; au retour, la session terminée entre-temps est créditée. */
const POMO_RUN_KEY = 'hunter-log-pomo-run';
function pomoPersist(){
  try{
    const full = (pomoMode==='work' ? STATE.pomo.workMin : STATE.pomo.breakMin) * 60;
    const idle = !pomoRunning && pomoMode==='work' && pomoRemaining >= full;
    if(idle && !pomoLinkedTaskId && !pomoIntent){ localStorage.removeItem(POMO_RUN_KEY); return; }
    localStorage.setItem(POMO_RUN_KEY, JSON.stringify({
      running: pomoRunning, mode: pomoMode, endAt: pomoEndAt, remaining: pomoRemaining,
      task: pomoLinkedTaskId, intent: pomoIntent,
    }));
  }catch(e){ /* stockage indisponible : le minuteur ne survivra pas à une fermeture */ }
}
function pomoRestore(){
  pomoInit();
  let r = null;
  try{ r = JSON.parse(localStorage.getItem(POMO_RUN_KEY) || 'null'); }catch(e){ r = null; }
  if(!r || typeof r !== 'object') return;
  if(r.task && STATE.tasks.some(t=>t.id===r.task)) pomoLinkedTaskId = r.task;
  if(typeof r.intent === 'string') pomoIntent = r.intent.slice(0, 80);
  pomoMode = r.mode === 'break' ? 'break' : 'work';
  const full = (pomoMode==='work' ? STATE.pomo.workMin : STATE.pomo.breakMin) * 60;
  if(r.running && typeof r.endAt === 'number' && r.endAt - Date.now() <= full*1000 + 5000){
    pomoRunning = true;
    pomoEndAt = r.endAt;
    pomoRemaining = Math.max(0, Math.round((pomoEndAt - Date.now())/1000));
    pomoInterval = setInterval(pomoTick, 1000);
  }else if(typeof r.remaining === 'number' && r.remaining > 0){
    pomoRemaining = Math.min(Math.round(r.remaining), full);
  }else{
    pomoMode = 'work';
    pomoRemaining = STATE.pomo.workMin*60;
  }
}
async function pomoRequestWakeLock(){
  try{
    if('wakeLock' in navigator){
      pomoWakeLock = await navigator.wakeLock.request('screen');
      pomoWakeLock.addEventListener('release', ()=>{ pomoWakeLock = null; });
    }
  }catch(e){ /* refusé ou indisponible : on continue sans, le timer reste correct grâce au timestamp */ }
}
function pomoReleaseWakeLock(){
  if(pomoWakeLock){ pomoWakeLock.release().catch(()=>{}); pomoWakeLock = null; }
}

function pomoToggle(){
  if(pomoRunning){
    pomoRunning = false;
    clearInterval(pomoInterval);
    pomoEndAt = null;
    pomoReleaseWakeLock();
  }else{
    const it = document.getElementById('pomoIntentInput');
    if(it) pomoIntent = it.value.trim().slice(0, 80);
    pomoRunning = true;
    pomoEndAt = Date.now() + pomoRemaining*1000;
    pomoInterval = setInterval(pomoTick, 1000);
    pomoRequestWakeLock();
  }
  syncPomoPush();
  render();
}
// Une session de focus arrivée à son terme (à l'heure `endedAt`, même si on s'en rend
// compte plus tard en revenant sur l'app).
function pomoCompleteWork(endedAt){
  const linkedTask = pomoLinkedTaskId ? STATE.tasks.find(x=>x.id===pomoLinkedTaskId) : null;
  const targetSkill = linkedTask ? linkedTask.skill : STATE.pomo.skill;
  const c = STATE.pomo.combo || (STATE.pomo.combo = {count:0, lastAt:0});
  const gapMax = (STATE.pomo.workMin + STATE.pomo.breakMin + 15) * 60000;
  c.count = (c.lastAt && endedAt - c.lastAt <= gapMax) ? c.count + 1 : 1;
  c.lastAt = endedAt;
  const mult = pomoComboMult(c.count);
  const xp = Math.round(pomoSessionXP() * mult);
  if(linkedTask) linkedTask.focusMinutes = (linkedTask.focusMinutes||0) + STATE.pomo.workMin;
  addSkillXP(targetSkill, xp);
  STATE.pomo.completedToday++;
  STATE.pomo.lastPomoDate = todayStr();
  STATE.stats.totalFocusMinutes += STATE.pomo.workMin;
  STATE.stats.totalPomoSessions = (STATE.stats.totalPomoSessions||0) + 1;
  STATE.stats.bestPomoCombo = Math.max(STATE.stats.bestPomoCombo||0, c.count);
  STATE.todayStats.focusMinutes += STATE.pomo.workMin;
  if(STATE.pomo.completedToday >= STATE.pomo.dailyGoal && !STATE.pomo.dailyGoalRewarded){
    STATE.pomo.dailyGoalRewarded = true;
    STATE.stats.pomoGoalHitCount++;
    addSkillXP(targetSkill, Math.round(pomoSessionXP()*0.5), 'Objectif pomodoro du jour atteint');
  }
  if(pomoIntent) pomoReview = {intent: pomoIntent};
  checkAchievements();
  queueSave();
  showToast('POMODORO TERMINÉ', `+${xp} XP`, c.count > 1 ? `COMBO ×${c.count} · XP ×${mult.toFixed(1).replace('.', ',')}` : (linkedTask ? linkedTask.name : ''));
  sfxPomodoroDone();
  refreshQuantifiedGoals();
  if(document.visibilityState !== 'visible' && STATE.settings.notificationsOn && typeof Notification!=='undefined' && Notification.permission==='granted'){
    fireNotification('SYSTEM // Hunter Log', `Session terminée — pause de ${STATE.pomo.breakMin} min`, 'hunter-log-pomo', {pomoAt: endedAt});
  }
}
function pomoTick(){
  if(!pomoRunning || pomoEndAt == null) return;
  // Toujours recalculé depuis l'heure réelle : juste même après une mise en veille.
  if(Date.now() >= pomoEndAt){
    if(pomoMode === 'work'){
      const endedAt = pomoEndAt;
      pomoCompleteWork(endedAt);
      pomoMode = 'break';
      pomoEndAt = endedAt + STATE.pomo.breakMin*60000;   // la pause part de la fin réelle de la session
      if(Date.now() < pomoEndAt){
        pomoRemaining = Math.max(0, Math.round((pomoEndAt - Date.now())/1000));
        syncPomoPush();   // retire du serveur la notification de fin de session (déjà affichée ici)
        render();
        return;
      }
    }
    if(pomoMode === 'break' && Date.now() >= pomoEndAt){
      // Fin de pause : on s'arrête et on attend l'utilisateur. Avant, le cycle repartait tout
      // seul — laisser tourner l'app pendant des heures aurait crédité des sessions fantômes.
      pomoRunning = false;
      clearInterval(pomoInterval);
      pomoEndAt = null;
      pomoReleaseWakeLock();
      pomoMode = 'work';
      pomoRemaining = STATE.pomo.workMin*60;
      showToast('PAUSE TERMINÉE', 'Lance la session suivante', pomoComboAlive() ? `prochaine session : XP ×${pomoComboMult(STATE.pomo.combo.count + 1).toFixed(1).replace('.', ',')} (combo)` : '');
      syncPomoPush();
      render();
      return;
    }
  }
  pomoRemaining = Math.max(0, Math.round((pomoEndAt - Date.now())/1000));
  renderPomo();
}
function pomoReset(){
  const elapsed = STATE.pomo.workMin*60 - pomoRemaining;
  if(pomoMode === 'work' && elapsed > 60 && STATE.pomo.combo && STATE.pomo.combo.count > 0){
    STATE.pomo.combo.count = 0;
    queueSave();
    showToast('COMBO PERDU', 'Session abandonnée', 'aucune autre pénalité', 'penalty');
  }
  pomoRunning = false; clearInterval(pomoInterval);
  pomoEndAt = null;
  pomoReleaseWakeLock();
  pomoMode = 'work'; pomoRemaining = STATE.pomo.workMin*60;
  syncPomoPush();
  render();
}

/* ---- Notification de fin même app fermée (push serveur) ----
   Le téléphone met l'app en pause quand l'écran s'éteint : elle ne peut pas sonner
   elle-même. On confie donc au serveur l'heure de fin de la session et de la pause
   (fonction pomo-timer) ; une tâche planifiée (pomo-notify, chaque minute) envoie le
   push. Nécessite d'avoir activé les notifications (Réglages → Notifs). */
async function syncPomoPush(){
  pomoPersist();
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if(!(STATE.settings.notificationsOn && typeof Notification!=='undefined' && Notification.permission==='granted')) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    const events = [];
    if(pomoRunning && pomoEndAt){
      if(pomoMode === 'work'){
        events.push({at: pomoEndAt, body: `⏱ Session terminée${pomoIntent ? ` — ${pomoIntent.slice(0, 60)}` : ''}. Pause de ${STATE.pomo.breakMin} min.`});
        events.push({at: pomoEndAt + STATE.pomo.breakMin*60000, body: '☕ Pause terminée — relance une session pour garder ton combo.'});
      }else{
        events.push({at: pomoEndAt, body: '☕ Pause terminée — relance une session pour garder ton combo.'});
      }
    }
    fetch('/.netlify/functions/pomo-timer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({subscription: sub.toJSON ? sub.toJSON() : sub, events}),
    }).catch(()=>{});
  }catch(e){ /* sans push, l'app sonne quand même si elle est ouverte */ }
}

function fmtHoursMin(totalMin){
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  if(h<=0) return `${m}min`;
  if(m<=0) return `${h}h`;
  return `${h}h${String(m).padStart(2,'0')}`;
}
// Renvoie la date (YYYY-MM-DD) du lundi de la semaine calendaire en cours
function startOfWeekStr(){
  const d = new Date();
  const isoDay = d.getDay()===0 ? 7 : d.getDay(); // lundi=1 ... dimanche=7
  const monday = new Date(d); monday.setDate(d.getDate()-(isoDay-1));
  return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
}
// Somme les minutes de focus depuis le lundi de la semaine en cours (reset chaque lundi)
function focusMinutesThisWeek(){
  const weekStart = startOfWeekStr();
  let total = STATE.todayStats.focusMinutes || 0;
  STATE.history.forEach(h=>{ if(h.date >= weekStart) total += (h.focusMinutes||0); });
  return total;
}
// Somme les minutes de focus enregistrées depuis N jours (aujourd'hui inclus)
function focusMinutesSinceDaysAgo(nDays){
  const today = new Date();
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - (nDays-1));
  const cutoffStr = periodKey('quotidienne', cutoff);
  let total = STATE.todayStats.focusMinutes || 0;
  STATE.history.forEach(h=>{ if(h.date >= cutoffStr) total += (h.focusMinutes||0); });
  return total;
}
// Somme les minutes de focus du mois calendaire en cours
function focusMinutesThisMonth(){
  const monthPrefix = periodKey('mensuelle');
  let total = STATE.todayStats.focusMinutes || 0;
  STATE.history.forEach(h=>{ if(h.date && h.date.startsWith(monthPrefix)) total += (h.focusMinutes||0); });
  return total;
}
