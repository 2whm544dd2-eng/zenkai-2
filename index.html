/* ---- Web Push (vrai push serveur, fonctionne même app fermée) ---- */
// Généré une fois pour ce déploiement — la clé PUBLIQUE seulement, sans risque à exposer.
const PUSH_VAPID_PUBLIC_KEY = 'BMIIMxgPMhtVutp5r-PkqV7NEIIUfgqs1aOgDYHn7FFAI3MaZ9eNnZG9SSX-uwPS7zMBu8rb8wVk9L7i4tpt91c';
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
// Clé publique VAPID : celle configurée sur Netlify (fonction vapid-key) si elle existe,
// sinon celle en dur ci-dessus. Si l'abonnement existant a été fait avec une autre clé
// (paire régénérée), on se réabonne : sinon le serveur ne pourrait jamais le joindre.
async function currentVapidKey(){
  try{
    const r = await fetch('/.netlify/functions/vapid-key', {cache:'no-store'});
    if(r.ok){ const d = await r.json(); if(d && typeof d.key === 'string' && d.key.length > 40) return d.key; }
  }catch(e){ /* hors ligne : clé en dur */ }
  return PUSH_VAPID_PUBLIC_KEY;
}
function sameKey(buf, b64){
  if(!buf) return true;   // navigateur qui n'expose pas la clé : on ne touche à rien
  const a = new Uint8Array(buf), b = urlBase64ToUint8Array(b64);
  return a.length === b.length && a.every((v,i)=>v===b[i]);
}
async function subscribeToPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const key = await currentVapidKey();
    let sub = await reg.pushManager.getSubscription();
    if(sub && !sameKey(sub.options && sub.options.applicationServerKey, key)){
      await sub.unsubscribe().catch(()=>{});
      sub = null;
    }
    if(!sub){
      sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(key)});
    }
    await syncPushState(sub);
  }catch(e){ /* pas grave : les notifs locales (app ouverte) continuent de fonctionner */ }
}
// Envoie au serveur le strict nécessaire pour qu'il sache QUOI et QUAND notifier —
// à appeler à chaque changement de l'engagement (submitCommitment) pour rester à jour.
async function syncPushState(existingSub){
  if(!('serviceWorker' in navigator)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = existingSub || await reg.pushManager.getSubscription();
    if(!sub) return;
    const commitment = STATE.commitment || {};
    const taskNames = (commitment.taskIds||[]).map(id=>{ const t=STATE.tasks.find(x=>x.id===id); return t?t.name:null; }).filter(Boolean);
    const body = {
      subscription: sub.toJSON ? sub.toJSON() : sub,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      state: {
        hasPendingTasks: STATE.tasks.some(t=>!t.done),
        commitmentForDate: commitment.forDate || null,
        commitmentTaskNames: taskNames,
      },
    };
    fetch('/.netlify/functions/subscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).catch(()=>{});
  }catch(e){ /* ignore */ }
}
function startNotificationWatcher(){
  if(notifTimer) return;
  notifTimer = setInterval(checkPlanningNotifications, 30000);
  // Un onglet/app en arrière-plan sur mobile voit son setInterval fortement ralenti ou
  // gelé par l'OS : le tick exact des 30s n'a donc quasiment aucune chance de tomber au
  // bon moment. Le rattrapage le plus fiable est de re-vérifier dès que l'app redevient
  // visible (déverrouillage du téléphone, retour au premier plan, etc.).
  if(!notifVisibilityBound){
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkPlanningNotifications(); });
    notifVisibilityBound = true;
  }
}
function fireNotification(title, body, tag, data){
  // Priorité au Service Worker : la notification reste fiable tant que le
  // navigateur tourne en arrière-plan, pas seulement onglet au premier plan.
  if('serviceWorker' in navigator && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg=>{
      reg.showNotification(title, {body, tag, renotify:true, vibrate:[30,40,30], data: data || {}});
    }).catch(()=>{
      try{ new Notification(title, {body}); }catch(e){ /* ignore */ }
    });
  }else{
    try{ new Notification(title, {body}); }catch(e){ /* ignore */ }
  }
}
const REMINDER_LEAD_MIN = 30;
function checkPlanningNotifications(){
  if(!STATE.settings.notificationsOn || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  const hhmm = now.toTimeString().slice(0,5);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const today = todayStr();
  // Rappel 30 min AVANT l'heure de la quête : on notifie dès qu'on entre dans la fenêtre
  // [heure-30min ; heure[ (pas seulement à la minute exacte, pour rattraper un tick manqué
  // quand l'app revient au premier plan), une seule fois par jour.
  planningItems().forEach(p=>{
    if(p.done) return;
    const [ph, pm] = p.time.split(':').map(Number);
    const itemMin = ph*60 + pm;
    const startMin = Math.max(0, itemMin - REMINDER_LEAD_MIN);
    const item = p.kind === 'routine' ? STATE.routines.find(r=>r.id===p.id) : STATE.tasks.find(t=>t.id===p.id);
    if(!item) return;
    if(nowMin >= startMin && nowMin < itemMin){
      // Rappel 30 min avant
      if(item.notifiedDate !== today){
        fireNotification('SYSTEM // Hunter Log', `${p.name} — dans ${itemMin - nowMin} min (${p.time})`, `hunter-log-${p.kind}-${p.id}`);
        item.notifiedDate = today;
        queueSave();
      }
    } else if(nowMin >= itemMin){
      const late = nowMin - itemMin;
      // Rappel "au moment même" (fenêtre de 5 min pour rattraper un tick manqué) — pour toutes les quêtes
      if(late < 5){
        if(item.notifiedNowDate !== today){
          fireNotification('SYSTEM // Hunter Log', `C'est l'heure : ${p.name} (${p.time})`, `hunter-log-now-${p.kind}-${p.id}`);
          item.notifiedNowDate = today;
          queueSave();
        }
      // Rappel "quête périmée" : uniquement pour les routines à pénalité de retard, une fois par jour,
      // tant que la quête n'est pas validée (rattrapé dès que l'app redevient visible)
      } else if(p.kind === 'routine' && item.deadlinePenalty && item.notifiedLateDate !== today){
        fireNotification('SYSTEM // Hunter Log', `Quête périmée : ${p.name} — prévue à ${p.time}`, `hunter-log-late-${p.kind}-${p.id}`);
        item.notifiedLateDate = today;
        queueSave();
      }
    }
  });
  checkCommitmentNotifications(hhmm, today);
}
// Rappel du soir (à partir de 20h) pour choisir l'engagement du lendemain, et rappel du matin
// des tâches non-négociables du jour — mêmes conditions que la bannière de l'onglet Aujourd'hui,
// mais poussées en notification système si elles sont activées. On ne teste plus une minute
// exacte (hhmm==='20:00') : un téléphone en veille rate presque toujours ce tick précis. On
// teste plutôt "il est ≥20h et pas encore notifié aujourd'hui", vérifié à chaque tick ET à
// chaque fois que l'app redevient visible (retour au premier plan, déverrouillage, etc.).
function checkCommitmentNotifications(hhmm, today){
  STATE.commitment = STATE.commitment || {forDate:null, taskIds:[], promptDismissedDate:null, eveningNotifiedDate:null, morningNotifiedDate:null};
  const hour = parseInt(hhmm.split(':')[0], 10);
  const alreadySetForTomorrow = STATE.commitment.forDate === tomorrowStr();
  if(!alreadySetForTomorrow && hour>=20 && STATE.commitment.eveningNotifiedDate !== today && STATE.tasks.some(t=>!t.done)){
    fireNotification('SYSTEM // Hunter Log', "🌙 Quelle(s) tâche(s) sont non-négociables demain ?", 'hunter-log-commitment-evening');
    STATE.commitment.eveningNotifiedDate = today;
    queueSave();
  }
  if(STATE.commitment.forDate === today && STATE.commitment.taskIds.length && STATE.commitment.morningNotifiedDate !== today){
    const names = STATE.commitment.taskIds.map(id=>{ const t = STATE.tasks.find(x=>x.id===id); return t ? t.name : null; }).filter(Boolean);
    if(names.length){
      fireNotification('SYSTEM // Hunter Log', `🌟 Non-négociable aujourd'hui : ${names.join(', ')}`, 'hunter-log-commitment-morning');
      STATE.commitment.morningNotifiedDate = today;
      queueSave();
    }
  }
}

/* ========================= HISTORY / WEEK CHART ========================= */
function getWeekDays(){
  const days = [...STATE.history.slice(-6)];
  days.push({date:STATE.todayStats.date, xpGained:STATE.todayStats.xpGained, waterMl:STATE.water.currentMl, routinesDone:STATE.todayStats.routinesDone, tasksDone:STATE.todayStats.tasksDone, goalsDone:STATE.todayStats.goalsDone});
  return days;
}
function buildWeekChart(metric){
  // Toujours 7 colonnes (les 7 derniers jours calendaires, aujourd'hui à droite). Avant :
  // une colonne par jour archivé seulement — avec 1 seul jour d'historique, l'unique barre
  // était étirée sur toute la largeur (un « 0 » géant) ; et un jour sans ouverture de l'app
  // disparaissait au lieu d'apparaître vide.
  const known = {};
  getWeekDays().forEach(d=>{ known[d.date] = d; });
  const days = [];
  const base = new Date((STATE.todayStats.date || todayStr())+'T00:00:00');
  for(let i=6;i>=0;i--){
    const dt = new Date(base); dt.setDate(base.getDate()-i);
    const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    days.push(known[key] || {date:key, xpGained:0, waterMl:0, missing:true});
  }
  const w=36, gap=8, chartH=80;
  const values = days.map(d=> metric==='xp' ? d.xpGained : d.waterMl);
  const maxVal = metric==='xp' ? Math.max(20, ...values.map(v=>Math.max(0,v))) : STATE.water.goalMl;
  const bars = days.map((d,i)=>{
    const v = metric==='xp' ? d.xpGained : d.waterMl;
    const h = Math.max(2, (Math.max(0,v)/maxVal)*chartH);
    const x = i*(w+gap);
    const dow = new Date(d.date+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short'}).slice(0,3);
    const isToday = d.date === STATE.todayStats.date;
    const negative = metric==='xp' && v<0;
    const goalHit = metric==='water' && v>=STATE.water.goalMl;
    const color = negative ? '#ff4d5e' : (goalHit ? '#ffe066' : (isToday ? '#22e5ff' : '#2fb8ff'));
    const label = metric==='xp' ? Math.round(v) : (v>=1000 ? (v/1000).toFixed(1)+'L' : Math.round(v)+'ml');
    return `<g transform="translate(${x},0)">
      <rect x="0" y="${(chartH-h).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" fill="${color}" opacity="${d.missing?0.18:(isToday?1:0.7)}" rx="3"/>
      ${d.missing ? '' : `<text x="${w/2}" y="${(chartH-h-6).toFixed(1)}" text-anchor="middle" fill="#8fa3c4" font-family="Space Mono, monospace" font-size="8.5">${escapeHtml(label)}</text>`}
      <text x="${w/2}" y="${chartH+15}" text-anchor="middle" fill="${isToday?'#22e5ff':'#5c7093'}" font-family="Space Mono, monospace" font-size="9">${escapeHtml(dow.toUpperCase())}</text>
    </g>`;
  }).join('');
  const totalW = days.length*(w+gap);
  return `<svg viewBox="0 0 ${totalW} ${chartH+26}" width="100%" style="max-width:340px;">${bars}</svg>`;
}
function buildPowerChart(){
  const days = [...STATE.history.slice(-29), {date:STATE.todayStats.date, level:STATE.hunterLevel, lifetimeXP:STATE.stats.lifetimeXP}];
  const w=680, h=140, padL=30, padB=20;
  const maxXP = Math.max(10, ...days.map(d=>d.lifetimeXP||0));
  const stepX = (w-padL)/Math.max(1, days.length-1);
  const pts = days.map((d,i)=>{
    const x = padL + i*stepX;
    const y = (h-padB) - ((d.lifetimeXP||0)/maxXP)*(h-padB-10);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const gridLines = [0,0.5,1].map(f=>{
    const y = (h-padB) - f*(h-padB-10);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#1b2942" stroke-width="1"/>
      <text x="2" y="${(y+3).toFixed(1)}" fill="#5c7093" font-family="Space Mono, monospace" font-size="8">${Math.round(maxXP*f)}</text>`;
  }).join('');
  const firstLabel = days[0] ? new Date(days[0].date+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const lastLabel = new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  return `<svg viewBox="0 0 ${w} ${h+14}" width="100%" style="max-width:600px;">
    ${gridLines}
    <polyline points="${pts.join(' ')}" fill="none" stroke="#22e5ff" stroke-width="2" style="filter:drop-shadow(0 0 4px rgba(34,229,255,0.6))"/>
    <circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="4" fill="#22e5ff"/>
    <text x="${padL}" y="${h+12}" fill="#5c7093" font-family="Space Mono, monospace" font-size="9">${firstLabel}</text>
    <text x="${w-30}" y="${h+12}" fill="#22e5ff" font-family="Space Mono, monospace" font-size="9">${lastLabel}</text>
  </svg>`;
}

/* ========================= SAUVEGARDE AUTOMATIQUE (filet de sécurité local) ========================= */
const AUTOBACKUP_KEY = 'sl-tracker-autobackups-v1';
const AUTOBACKUP_MAX = 7; // on garde les 7 dernières sauvegardes automatiques

async function getAutoBackups(){
  try{
    const raw = await storeGet(AUTOBACKUP_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function maybeAutoBackup(){
  // Une sauvegarde automatique par jour maximum, pour ne pas spammer le stockage
  const today = todayStr();
  let backups = await getAutoBackups();
  if(backups.length && backups[backups.length-1].date === today) return;
  backups.push({date: today, snapshot: JSON.stringify(STATE)});
  if(backups.length > AUTOBACKUP_MAX) backups = backups.slice(-AUTOBACKUP_MAX);
  try{ await storeSet(AUTOBACKUP_KEY, JSON.stringify(backups)); }catch(e){ /* stockage plein ou indisponible */ }
}
async function listAutoBackupsHtml(){
  const backups = await getAutoBackups();
  if(!backups.length) return `<div class="sub">Aucune sauvegarde automatique pour le moment.</div>`;
  return backups.slice().reverse().map((b,i)=>{
    const realIdx = backups.length-1-i;
    return `<div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(47,184,255,0.15);">
      <span>${b.date}</span>
      <button class="btn ghost small" onclick="restoreAutoBackup(${realIdx})">Restaurer</button>
    </div>`;
  }).join('');
}
async function restoreAutoBackup(idx){
  const backups = await getAutoBackups();
  const b = backups[idx];
  if(!b) return;
  if(!(await confirmModal(`Restaurer la sauvegarde automatique du ${b.date} ? Les données actuelles non exportées seront remplacées.`, {title:'RESTAURER LA SAUVEGARDE', confirmLabel:'Restaurer'}))) return;
  try{
    STATE = JSON.parse(b.snapshot);
    migrateState();
    queueSave(); closeModal(); pomoReset(); render();
    showToast('RESTAURATION RÉUSSIE', `Sauvegarde du ${b.date} restaurée`);
  }catch(e){
    showToast('ERREUR', 'Sauvegarde corrompue, restauration impossible', '', 'penalty');
  }
}
async function modalAutoBackups(){
  const html = await listAutoBackupsHtml();
  openModal(`
    <h3>SAUVEGARDES AUTOMATIQUES</h3>
    <div class="sub" style="margin-bottom:10px;">Une sauvegarde locale est prise chaque jour (7 derniers jours conservés). Elle reste sur cet appareil : utilise « Exporter » pour transférer tes données ailleurs.</div>

function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(typeof data !== 'object' || !data.skills) throw new Error('format invalide');
      STATE = data;
      migrateState();
      queueSave(); closeModal(); pomoReset(); render();
      showToast('IMPORT RÉUSSI', 'Données restaurées');

    }
  };
  reader.readAsText(file);
  input.value = '';
}

let _pendingConfirmResolve = null;
function openModal(html){
  // Une confirmModal() encore en attente et remplacée par une autre fenêtre = "Annuler"
  // (sinon sa Promise restait en suspens pour toujours).
  if(_pendingConfirmResolve){ const r = _pendingConfirmResolve; _pendingConfirmResolve = null; r(false); }
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  // Une confirmModal() encore en attente (fermeture via clic hors-modale, ex.) équivaut à "Annuler".
  if(_pendingConfirmResolve){ const resolve = _pendingConfirmResolve; _pendingConfirmResolve = null; resolve(false); }
}
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

// Remplace window.confirm() (fenêtre système, hors charte graphique) par une fenêtre modale
// cohérente avec le reste de l'app — même motif que confirmResetAll() plus bas, généralisé.
// Retourne une Promise<boolean> : `if(!(await confirmModal("..."))) return;` équivaut à
// l'ancien `if(!confirm("...")) return;`.
function confirmModal(message, opts = {}){
  return new Promise(resolve => {
    const danger = opts.danger !== false; // rouge par défaut (la quasi-totalité des usages sont des suppressions)
    openModal(`
      <h3 style="${danger?'color:var(--danger)':''}">${escapeHtml(opts.title || 'CONFIRMATION')}</h3>
      <p style="font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); line-height:1.6; margin-bottom:6px;">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" onclick="resolveConfirm(false)">Annuler</button>
        <button class="btn ${danger?'danger-outline':''}" onclick="resolveConfirm(true)">${escapeHtml(opts.confirmLabel || 'Confirmer')}</button>
      </div>
    `);
    _pendingConfirmResolve = resolve; // après openModal(), qui annule toute confirmation précédente
  });
}
function resolveConfirm(result){
  const resolve = _pendingConfirmResolve;
  _pendingConfirmResolve = null;
  closeModal();
  if(resolve) resolve(result);
}

async function deleteSkill(key){
  if(Object.keys(STATE.skills).length <= 1) return;
  const s = STATE.skills[key];
  const isBase = BASE_SKILLS.includes(key);
  const msg = isBase
    ? `⚠️ "${s.name}" fait partie des 5 compétences de base du système (Focus/Force/Apprentissage/Nutrition/Discipline). La supprimer casse cette structure d'origine et ne peut pas être annulé facilement. Les routines/tâches/objectifs liés seront réassignés.`
    : `Supprimer la compétence "${s.name}" ? Les routines/tâches/objectifs liés seront réassignés.`;
  if(!(await confirmModal(msg, {title: isBase ? 'COMPÉTENCE DE BASE' : 'SUPPRIMER LA COMPÉTENCE', confirmLabel:'Supprimer'}))) return;
  delete STATE.skills[key];
  const fallback = Object.keys(STATE.skills)[0];
  STATE.routines.forEach(r=>{ if(!STATE.skills[r.skill]) r.skill = fallback; });
  STATE.tasks.forEach(t=>{ if(!STATE.skills[t.skill]) t.skill = fallback; });
  STATE.goals.forEach(g=>{ if(!STATE.skills[g.skill]) g.skill = fallback; });
  if(!STATE.skills[STATE.pomo.skill]) STATE.pomo.skill = fallback;
  if(!STATE.skills[STATE.water.skill]) STATE.water.skill = fallback;
  queueSave(); render();
}

function submitAddRoutine(){
  const name = document.getElementById('mName').value.trim();
  const skill = document.getElementById('mSkill').value;
  const xp = Math.max(1, parseInt(document.getElementById('mXP').value)||10);
  const time = document.getElementById('mTime').value || null;
  const freqTag = document.getElementById('mFreq').value;
  const morning = document.getElementById('mMorning').value === 'true';
  const deadlinePenalty = (document.getElementById('mDeadlinePenalty').value === 'true') && !!time;
  const editId = document.getElementById('mEditId')?.value;
  if(!name) return;
  if(editId){
    const r = STATE.routines.find(x=>x.id===editId);
    if(r){
      const freqChanged = r.freqTag !== freqTag;
      Object.assign(r, {name, skill, xp, time, freqTag, morning, deadlinePenalty});
      if(!time) r.deadlinePenalty = false;

function applyTaskEditXpCorrection(oldTask, newSkill, newXp, newSubtasksInput){
  // Corrige l'XP déjà versée quand on modifie l'XP totale, la compétence ou les sous-tâches
  // d'une quête qui a déjà des sous-tâches cochées (ou déjà entièrement validée), pour que
  // le total réellement reçu reste cohérent avec les nouveaux réglages.
  if(oldTask.type==='repetable') return; // pas d'état persistant à corriger pour les quêtes répétables
  if(oldTask.done){
    // Toute l'XP de la quête a déjà été versée en totalité : on ajuste juste par la différence.
    const delta = newXp - oldTask.xp;
    if(delta !== 0) addSkillXP(newSkill, delta);
    return;
  }
  const oldSplit = subtaskXpSplit(oldTask);
  const newSplit = subtaskXpSplit({xp:newXp, subtasks:newSubtasksInput});
  const oldDoneIds = new Set((oldTask.subtasks||[]).filter(s=>s.done).map(s=>s.id));
  const newIds = new Set(newSubtasksInput.map(s=>s.id));
  let oldAwarded = 0, newAwarded = 0;
  newSubtasksInput.forEach(s=>{
    if(s.done){
      newAwarded += newSplit.perSub;
      if(oldDoneIds.has(s.id)) oldAwarded += oldSplit.perSub;
    }
  });
  // Sous-tâches cochées avant l'édition mais supprimées dans l'éditeur : leur XP déjà reçue doit être retirée.
  (oldTask.subtasks||[]).forEach(s=>{
    if(s.done && !newIds.has(s.id)) oldAwarded += oldSplit.perSub;
  });
  if(oldTask.skill === newSkill){
    const delta = newAwarded - oldAwarded;
    if(delta !== 0) addSkillXP(newSkill, delta);
  }else{
    if(oldAwarded>0) addSkillXP(oldTask.skill, -oldAwarded);
    if(newAwarded>0) addSkillXP(newSkill, newAwarded);
  }
}

  const time = document.getElementById('mTime').value || null;

  const editId = document.getElementById('mEditId')?.value;

  if(!name) return;

    if(t){
      const oldSnapshot = {xp:t.xp, skill:t.skill, done:t.done, type:t.type, subtasks:(t.subtasks||[]).map(s=>({...s}))};
      Object.assign(t, {name, skill, priority, type, rank, xp, time, dueDate, subtasks});
      applyTaskEditXpCorrection(oldSnapshot, skill, xp, subtasks);
    }
  }else{
    STATE.tasks.push({id:'t'+Date.now(), name, skill, priority, type, rank, xp, done:false, time, dueDate, notifiedDate:null, timesCompleted:0, completedDate:null, subtasks});

function toggleTask(id){
  const t = STATE.tasks.find(x=>x.id===id);
  if(!t) return;
  if(t.type==='limitee' && t.dueDate && t.dueDate < todayStr() && !t.done){
    showToast('QUÊTE EXPIRÉE', t.name, "Cette quête n'est plus valide", 'penalty');
    return;
  }
  if(t.type==='repetable'){
    t.timesCompleted = (t.timesCompleted||0) + 1;
    (t.subtasks||[]).forEach(s=>{ s.done = false; }); // reset des sous-tâches à chaque nouveau cycle (pas d'XP individuelle sur ce type)
    STATE.todayStats.tasksDone++;
    STATE.stats.totalTasksDone++;
    if(t.rank==='S') STATE.stats.sRankDone++;
    checkNightOwl();
    sfxCheck();
    addSkillXP(t.skill, t.xp);
    return;
  }
  if(t.done){
    // Réouverture: on retire l'intégralité de l'XP de la quête (déjà versée en totalité lors de la validation,
    // que ce soit via les sous-tâches cochées individuellement ou le bonus final) et on réinitialise les sous-tâches
    // pour qu'elles redeviennent "à faire" — sinon elles resteraient cochées sans que leur XP ait été payée.
    (t.subtasks||[]).forEach(s=>{ s.done = false; });
    t.done = false;
    t.completedDate = null;
    addSkillXP(t.skill, -t.xp);
    return;
  }
  const subtasks = t.subtasks || [];
  const {perSub, bonus} = subtaskXpSplit(t);
  let amount = bonus;
  subtasks.forEach(s=>{
    if(!s.done){ s.done = true; amount += perSub; } // complète les sous-tâches pas encore cochées individuellement
  });
  t.done = true;
  t.completedDate = todayStr();
  STATE.todayStats.tasksDone++;
  STATE.stats.totalTasksDone++;
  if(t.rank==='S') STATE.stats.sRankDone++;
  checkNightOwl();
  sfxCheck();
  addSkillXP(t.skill, amount);
}

function reporterTask(id){
  const t = STATE.tasks.find(x=>x.id===id);

  const base = t.dueDate ? new Date(t.dueDate+'T00:00:00') : new Date();
  base.setDate(base.getDate()+1);
  t.dueDate = `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`;
  queueSave(); render();
  showToast('QUÊTE REPORTÉE', t.name, base.toLocaleDateString('fr-FR'));
}
// `after` : callback optionnel rappelé une fois la fenêtre de confirmation fermée
// (ex. rouvrir l'historique des tâches d'où la suppression a été lancée).
async function deleteTask(id, after){
  const t = STATE.tasks.find(x=>x.id===id);
  const ok = await confirmModal(t && t.done
    ? `Supprimer « ${t.name} » de l'historique ? L'XP déjà gagnée est conservée.`
    : `Supprimer « ${t ? t.name : 'cette quête'} » ? Elle comptera comme abandonnée dans tes stats.`,
    {title:'SUPPRIMER LA QUÊTE', confirmLabel:'Supprimer'});
  if(!ok){ if(after) after(); return; }
  if(t && !t.done){
    STATE.stats.tasksAbandoned++;
    STATE.todayStats.tasksAbandoned = (STATE.todayStats.tasksAbandoned||0) + 1;
  }
  STATE.tasks = STATE.tasks.filter(x=>x.id!==id);
  queueSave(); render();
  if(after) after();
}

function submitAddGoal(){

      if(progressType==='binaire'){ g.currentValue = 0; }
    }
  }else{

function completeGoal(g){

  g.completedDate = todayStr();
  STATE.todayStats.goalsDone++;
  STATE.stats.totalGoalsDone++;
  if(g.rank==='S') STATE.stats.sRankDone++;
  sfxCheck();
  addSkillXP(g.skill, g.xp, g.reward || null); // addSkillXP se charge de queueSave()/render()/checkAchievements()
}
function toggleGoal(id){
  const g = STATE.goals.find(x=>x.id===id);
  if(!g) return;
  if(g.progressType === 'quantifie') return; // se complète automatiquement via sa progression
  if(g.done){ g.done=false; g.completedDate=null; queueSave(); render(); return; }
  completeGoal(g);
}
// Calcule la valeur courante d'un objectif quantifié relié à une source de données déjà suivie par l'app
function computeAutoGoalValue(g){
  const start = g.createdDate || '0000-00-00';
  if(g.linkedSource === 'workouts_count' || g.linkedSource === 'workouts_minutes'){
    const logs = STATE.workouts.log.filter(w => w.date >= start && (!g.linkedWorkoutType || w.type === g.linkedWorkoutType));
    return g.linkedSource === 'workouts_count' ? logs.length : logs.reduce((s,w)=>s+w.durationMin,0);
  }
  if(g.linkedSource === 'focus_minutes'){
    let total = (STATE.todayStats.date >= start) ? (STATE.todayStats.focusMinutes||0) : 0;
    STATE.history.forEach(h=>{ if(h.date >= start) total += (h.focusMinutes||0); });
    return total;
  }
  if(g.linkedSource === 'water_days'){
    let count = (STATE.todayStats.date >= start && STATE.water.currentMl >= STATE.water.goalMl) ? 1 : 0;
    STATE.history.forEach(h=>{ if(h.date >= start && h.waterGoalHit) count++; });
    return count;
  }
  return g.currentValue||0; // manuel : pas de source auto, valeur déjà stockée
}
// Recalcule et complète automatiquement les objectifs quantifiés reliés à une source de données.
// À appeler après toute action qui alimente une de ces sources (sport, focus, eau, changement de jour).
function refreshQuantifiedGoals(){
  STATE.goals.forEach(g=>{
    if(g.progressType !== 'quantifie' || g.done) return;
    if(g.linkedSource && g.linkedSource !== 'manuel') g.currentValue = computeAutoGoalValue(g);
    if(g.targetValue && g.currentValue >= g.targetValue) completeGoal(g);
  });
}
// Ajustement manuel (+1/-1 etc.) pour les objectifs quantifiés sans source auto
function incrementGoalValue(id, delta){
  const g = STATE.goals.find(x=>x.id===id);
  if(!g || g.progressType!=='quantifie' || g.done) return;
  g.currentValue = Math.max(0, (g.currentValue||0) + delta);
  if(g.targetValue && g.currentValue >= g.targetValue){ completeGoal(g); return; }
  queueSave(); render();
}
// Pourcentage d'avancement d'un objectif : priorité aux sous-tâches si elles existent,
// sinon à la progression quantifiée, sinon au pourcentage manuel simple.
function goalProgressPct(g){
  if(g.subtasks && g.subtasks.length){
    const done = g.subtasks.filter(s=>s.done).length;
    return Math.round(done/g.subtasks.length*100);
  }
  if(g.progressType==='quantifie' && g.targetValue){
    return Math.min(100, Math.round((g.currentValue||0)/g.targetValue*100));
  }
  return g.progressPercent||0;
}
function toggleGoalSubtask(goalId, subId){
  const g = STATE.goals.find(x=>x.id===goalId);
  if(!g || g.done) return;
  const st = (g.subtasks||[]).find(s=>s.id===subId);
  if(!st) return;
  st.done = !st.done;
  if(goalProgressPct(g) >= 100){ completeGoal(g); return; }
  queueSave(); render();
}
function setGoalPercent(goalId, pct){
  const g = STATE.goals.find(x=>x.id===goalId);
  if(!g || g.done || (g.subtasks&&g.subtasks.length)) return;
  g.progressPercent = Math.max(0, Math.min(100, parseInt(pct)||0));
  if(g.progressPercent >= 100){ completeGoal(g); return; }
  queueSave(); render();
}
function renderGoalSubtasksBlock(g){
  const subtasks = g.subtasks||[];
  if(!subtasks.length) return {toggle:'', list:''};
  const subDone = subtasks.filter(s=>s.done).length;
  const expanded = expandedSubtasks.has(g.id);
  const toggle = `<span class="xp-tag subtask-progress" onclick="toggleSubtasksExpand('${g.id}')">☑ ${subDone}/${subtasks.length} ${expanded?'▲':'▼'}</span>`;
  let list = '';
  if(expanded){
    list = `<div class="subtask-list">${subtasks.map(s=>`
      <div class="subtask-row ${s.done?'done':''}" onclick="toggleGoalSubtask('${g.id}','${s.id}')">
        <span class="subtask-chk ${s.done?'done':''}">${s.done?'✓':''}</span>
        <span>${escapeHtml(s.name)}</span>
      </div>`).join('')}</div>`;
  }
  return {toggle, list};
}
async function deleteGoal(id){
  const g = STATE.goals.find(x=>x.id===id);
  const ok = await confirmModal(`Supprimer l'objectif « ${g ? g.name : ''} » et toute sa progression ? Action irréversible.`,
    {title:"SUPPRIMER L'OBJECTIF", confirmLabel:'Supprimer'});

  STATE.goals = STATE.goals.filter(x=>x.id!==id);

// cachés, côté gauche dès qu'on a scrollé — recalculé à chaque render() puisque le DOM est
// reconstruit à chaque fois.
function setupTabbarScrollFade(){
  const wrap = document.getElementById('tabbarWrap');
  const scroller = document.getElementById('tabbarScroll');
  if(!wrap || !scroller) return;
  const update = () => {
    wrap.classList.toggle('scroll-start', scroller.scrollLeft <= 2);
    wrap.classList.toggle('scroll-end', scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 2);
  };
  update();
  scroller.addEventListener('scroll', update, {passive:true});
}

function sortByPriority(list){
  return [...list].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    return (PRIORITY_ORDER[a.priority]??1) - (PRIORITY_ORDER[b.priority]??1);
  });
}

        <div class="item-meta"><span style="font-family:var(--font-mono); color:var(--cyan);">${hasSubtasks ? pct+'%' : isQ ? `${g.currentValue||0} / ${g.targetValue} ${escapeHtml(g.unit||'')}` : pct+'%'}</span></div>

          <span class="term-chip ${g.term}">${g.term==='court'?'CT':'MT'}</span>
          <span class="rank-chip" style="color:${rankForLevel(RANK_THRESHOLDS[g.rank]||1).color}; font-size:9px; padding:1px 4px;">${g.rank}</span>

function tabCalendar(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calendarMonthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let startDow = new Date(year, month, 1).getDay();
  startDow = (startDow+6)%7; // lundi = 0
  const todayS = todayStr();

  const itemsByDate = {};
  STATE.tasks.filter(t=>t.type==='limitee' && t.dueDate).forEach(t=>{
    (itemsByDate[t.dueDate] = itemsByDate[t.dueDate]||[]).push({color: t.done ? '#3ddc84' : PRIORITY_COLOR[t.priority]});
  });
  STATE.goals.filter(g=>g.targetDate).forEach(g=>{
    (itemsByDate[g.targetDate] = itemsByDate[g.targetDate]||[]).push({color: g.done ? '#3ddc84' : '#9b6bff'});
  });

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = itemsByDate[dateStr]||[];
    const isToday = dateStr===todayS;
    cells += `
      <div class="cal-day ${isToday?'today':''}" onclick="showCalendarDay('${dateStr}')">
        <span>${d}</span>

function setAchievementsFilter(f){
  achievementsFilter = f;
  render();
}
function tabAchievements(){
  const unlockedCount = Object.keys(STATE.achievements).length;
  const remainingCount = ACHIEVEMENTS.length - unlockedCount;
  const visibleAchievements = ACHIEVEMENTS.filter(a=>{
    const unlocked = !!STATE.achievements[a.id];
    if(achievementsFilter==='unlocked') return unlocked;
    if(achievementsFilter==='locked') return !unlocked;
    return true;
  });
  // Débloqués d'abord (du plus prestigieux au plus modeste), puis les verrouillés les plus avancés.
  const tierRank = {platine:0, or:1, argent:2, bronze:3};
  const sorted = [...visibleAchievements].sort((a,b)=>{
    const ua = !!STATE.achievements[a.id], ub = !!STATE.achievements[b.id];
    if(ua !== ub) return ua ? -1 : 1;
    if(ua) return (tierRank[ACH_TIER[a.id]]??3) - (tierRank[ACH_TIER[b.id]]??3);
    const pa = (a.hidden ? -1 : (achProgress(a)||{pct:0}).pct), pb = (b.hidden ? -1 : (achProgress(b)||{pct:0}).pct);
    return pb - pa;
  });
  const badges = sorted.length ? `<div class="ach-grid">${sorted.map(achCard).join('')}</div>` : '<div class="empty">RIEN À AFFICHER ICI</div>';
  const tierSummary = ['platine','or','argent','bronze'].map(k=>{
    const all = ACHIEVEMENTS.filter(a=>(ACH_TIER[a.id]||'bronze')===k);
    const got = all.filter(a=>STATE.achievements[a.id]).length;
    return `<div class="ach-tier-count"><span class="ach-tier-dot" style="background:linear-gradient(135deg, ${ACH_TIERS[k].hi}, ${ACH_TIERS[k].mid} 55%, ${ACH_TIERS[k].lo});"></span><b>${got}</b><span>/${all.length} ${ACH_TIERS[k].label}</span></div>`;
  }).join('');

  const daysSinceStart = STATE.firstUseDate ? Math.max(1, Math.round((new Date(todayStr()+'T00:00:00') - new Date(STATE.firstUseDate+'T00:00:00'))/86400000)+1) : 1;
  const avgXpDay = Math.round(STATE.stats.lifetimeXP / daysSinceStart);
  const bestDay = STATE.history.reduce((best,d)=> (d.xpGained>(best?best.xpGained:-Infinity)) ? d : best, null);
  let bestHour = 0, bestHourXP = -1;
  STATE.stats.xpByHour.forEach((v,h)=>{ if(v>bestHourXP){ bestHourXP=v; bestHour=h; } });
  let bestSkillKey = null, bestSkillXP = -1, worstSkillKey = null, worstSkillXP = Infinity;
  Object.keys(STATE.skills).forEach(k=>{
    const v = STATE.stats.xpBySkill[k]||0;
    if(v>bestSkillXP){ bestSkillXP=v; bestSkillKey=k; }
    if(v<worstSkillXP){ worstSkillXP=v; worstSkillKey=k; }
  });
  const totalQuestActions = STATE.stats.totalTasksDone + STATE.stats.tasksAbandoned;
  const completionRate = totalQuestActions>0 ? Math.round(STATE.stats.totalTasksDone/totalQuestActions*100) : 100;
  const currentStreak = Math.max(0, ...STATE.routines.map(r=> routineStreakAlive(r) ? r.streak : 0), 0);

  return `
    ${oathPanelHtml()}

    <div class="panel full" style="margin-top:16px;">
      <div class="c-tl"></div><div class="c-br"></div>
      ${achShieldDefs()}
      <div class="eyebrow">ACHIEVEMENTS</div>
      <h2>Écussons (${unlockedCount}/${ACHIEVEMENTS.length})</h2>
      <div class="sub">LE MÉTAL DIT LA DIFFICULTÉ · CERTAINS SONT CACHÉS</div>
      <div class="ach-tiers">${tierSummary}</div>
      <div style="display:flex; gap:8px; margin:12px 0 6px;">
        <button class="btn ${achievementsFilter==='all'?'':'ghost'} small" style="flex:1;" onclick="setAchievementsFilter('all')">Tous</button>
        <button class="btn ${achievementsFilter==='unlocked'?'':'ghost'} small" style="flex:1;" onclick="setAchievementsFilter('unlocked')">Débloqués (${unlockedCount})</button>
        <button class="btn ${achievementsFilter==='locked'?'':'ghost'} small" style="flex:1;" onclick="setAchievementsFilter('locked')">Restants (${remainingCount})</button>
      </div>
      ${badges}
    </div>

    <div class="panel full" style="margin-top:16px;">
      <div class="c-tl"></div><div class="c-br"></div>
      <div class="eyebrow">ANALYSIS</div>
      <h2>Analyse du joueur</h2>
      <div class="hunter-stats" style="row-gap:14px;">
        <div class="stat"><b>${completionRate}%</b>TAUX DE COMPLÉTION</div>
        <div class="stat"><b>${STATE.stats.totalTasksDone}</b>TÂCHES TERMINÉES</div>
        <div class="stat"><b>${STATE.stats.tasksAbandoned}</b>TÂCHES ABANDONNÉES</div>
        <div class="stat"><b>${STATE.stats.lifetimeXP}</b>XP TOTALE</div>
        <div class="stat"><b>${avgXpDay}</b>XP MOYENNE/JOUR</div>
        <div class="stat"><b>${Math.round(STATE.stats.totalFocusMinutes/60)}h</b>TEMPS DE FOCUS</div>
        <div class="stat"><b>${bestDay?bestDay.date:'—'}</b>MEILLEUR JOUR</div>
        <div class="stat"><b>${bestHour}h</b>HEURE LA PLUS PRODUCTIVE</div>
        <div class="stat"><b>${bestSkillKey && STATE.skills[bestSkillKey] ? STATE.skills[bestSkillKey].name : '—'}</b>CATÉGORIE LA PLUS PRODUCTIVE</div>
        <div class="stat"><b>${worstSkillKey && STATE.skills[worstSkillKey] ? STATE.skills[worstSkillKey].name : '—'}</b>CATÉGORIE LA MOINS PRODUCTIVE</div>
        <div class="stat"><b>${currentStreak}j</b>STREAK ACTUEL</div>
        <div class="stat"><b>${STATE.stats.bestStreak}j</b>MEILLEUR STREAK</div>
        <div class="stat"><b>${STATE.hunterLevel}</b>NIVEAU</div>
      </div>
    </div>`;
}

function currentThemeId(){
  const t = STATE.settings.visualTheme;
  return VISUAL_THEMES.some(x=>x.id===t) ? t : 'monarch';
}
const loadedThemeFonts = new Set();
function applyVisualTheme(){
  const id = currentThemeId();
  const theme = VISUAL_THEMES.find(x=>x.id===id);
  VISUAL_THEMES.forEach(x=>{ if(x.cls) document.body.classList.toggle(x.cls, x.id===id); });
  document.body.classList.toggle('nav-bottom', !!theme.navBottom);
  if(theme.fonts && !loadedThemeFonts.has(id)){
    loadedThemeFonts.add(id);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?${theme.fonts}&display=swap`;
    document.head.appendChild(link);
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', theme.color);
}

function generateIcon(size){
  return APP_ICONS[size] || APP_ICONS[192];
}
function setupPWA(){
  try{
    const icon180 = generateIcon(180);
    const icon192 = generateIcon(192);
    const icon512 = generateIcon(512);
    document.getElementById('appleIcon').href = icon180;
    document.getElementById('favIcon').href = icon180;

    const manifest = {
      name: 'Hunter Log — Habit Tracker',
      short_name: 'Hunter Log',
      start_url: '.',
      display: 'standalone',
      background_color: '#05070c',
      theme_color: '#05070c',
      icons: [{src: icon192, sizes:'192x192', type:'image/png'}, {src: icon512, sizes:'512x512', type:'image/png'}],
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);

    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      // sw.js est un fichier statique servi à la racine du site (voir sw.js dans le repo).
      // Ancienne version : enregistrement via blob: URL, rejeté silencieusement par
      // Chrome/Firefox (SecurityError) — les notifications push ne fonctionnaient donc
      // jamais quand l'app était fermée. Corrigé le 28/09/2026.
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.error('[ZENKAI] Échec enregistrement service worker:', err);
      });
    }

    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if(!standalone && !hasClaudeStorage()){
      const hint = document.getElementById('installHint');
      if(hint){
        hint.style.display = 'block';
        // Le geste d'installation n'est pas le même partout : une seule consigne générique
        // (la formulation Android) était fausse pour iPhone et pour ordinateur.
        const ua = navigator.userAgent || '';
        const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(ua);
        hint.textContent = isIOS
          ? "📲 Installe l'app : dans Safari, bouton Partager (carré avec flèche) → « Sur l'écran d'accueil ». Nécessaire aussi pour recevoir les notifications sur iPhone."
          : isAndroid
            ? "📲 Installe l'app : menu ⋮ du navigateur → « Installer l'application » (ou « Ajouter à l'écran d'accueil »)."
            : "📲 Installe l'app : icône d'installation à droite de la barre d'adresse (Chrome / Edge), ou garde simplement cet onglet en favori.";
      }
    }
  }catch(e){ /* PWA setup is best-effort */ }
}

/* ========================= INIT ========================= */
(async function init(){
  await loadState();
  await loadSyncMeta();
  if(syncCode) await pullStateFromServer();
  checkDayRollover();
  pomoRestore();
  render();
  if(pomoRunning){ pomoTick(); pomoRequestWakeLock(); }
  if(!STATE.settings.awakeningDone && !window.__skipAwaken) setTimeout(showAwakening, 350);   // __skipAwaken : tests automatiques
  setupPWA();
  if(STATE.settings.notificationsOn && typeof Notification!=='undefined' && Notification.permission==='granted'){
    startNotificationWatcher();
    checkPlanningNotifications();
    subscribeToPush();
  }
  setInterval(checkRoutineDeadlines, 30000);
  if(STATE.pendingWeeklyRecap){
    STATE.pendingWeeklyRecap = false;
    queueSave();
    setTimeout(()=>modalWeeklyRecap(), 400);
  }
  if(pendingThemeNotice){
    pendingThemeNotice = false;
    queueSave();
    setTimeout(()=>showToast('NOUVEAU STYLE', 'Monarque', 'Réglages ⚙ → Affichage pour revenir', 'reward'), 900);
  }
})();
</script>
