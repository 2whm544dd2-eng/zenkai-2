<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SYSTEM // Hunter Log</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter Log">
<meta name="theme-color" content="#05070c">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="icon" id="favIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Cinzel:wght@600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #030509;
    --bg-panel: #0b1424;
    --bg-panel-2: #0e1a30;
    --line: #22334c;
    --glow: #2fb8ff;
    --glow-dim: #1a5f8a;
    --cyan: #22e5ff;
    --purple: #9b6bff;
    --gold: #ffc94d;
    --text: #e6eefb;
    --text-dim: #7089ae;
    --text-faint: #3a4d6e;
    --danger: #ff4d5e;
    --ok: #3ddc84;
    --radius: 4px;
    --radius-lg: 8px;
    --shadow-panel: 0 16px 40px -18px rgba(0,0,0,0.65), 0 2px 0 rgba(255,255,255,0.02) inset;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100%;}
  body{
    background-image:
      radial-gradient(ellipse at 15% -10%, rgba(47,184,255,0.16), transparent 42%),
      radial-gradient(ellipse at 95% 8%, rgba(255,201,77,0.05), transparent 38%),
      radial-gradient(ellipse at 90% 115%, rgba(155,107,255,0.13), transparent 50%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    padding: max(20px, env(safe-area-inset-top)) 16px 60px;
    overflow-x:hidden;
  }
  .wrap{max-width:1180px; margin:0 auto;}

  .panel{
    position:relative;
    background: linear-gradient(165deg, var(--bg-panel), var(--bg-panel-2) 65%);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px;
    box-shadow: var(--shadow-panel), 0 0 0 1px rgba(47,184,255,0.04), inset 0 0 50px rgba(47,184,255,0.025);
  }
  .panel::before{
    content:''; position:absolute; top:0; left:14px; right:14px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(47,184,255,0.35), transparent); pointer-events:none;
  }
  .panel .c-tl, .panel .c-br{content:''; position:absolute; width:16px; height:16px; pointer-events:none;}
  .panel .c-tl::after, .panel .c-br::after{content:''; position:absolute; width:4px; height:4px; background:var(--glow); box-shadow:0 0 6px 1px var(--glow);}
  .panel-compact{padding:14px !important;}
  .panel-compact h2{font-size:13.5px !important;}
  .panel-compact .sub{font-size:9.5px !important;}
  .panel-compact .item{padding:7px 0 !important; gap:8px !important;}
  .panel-compact .item-name{font-size:12px !important;}
  .panel-compact .item-meta{font-size:9.5px !important;}
  .panel-compact .btn.wide{padding:8px !important; font-size:11px !important;}
  .panel .c-tl{top:-1px; left:-1px; border-top:2px solid var(--glow); border-left:2px solid var(--glow); border-top-left-radius:3px;}
  .panel .c-br{bottom:-1px; right:-1px; border-bottom:2px solid var(--glow); border-right:2px solid var(--glow); border-bottom-right-radius:3px;}
  .panel .c-tl::after{top:-2px; left:-2px;}
  .panel .c-br::after{bottom:-2px; right:-2px;}

  .eyebrow{
    font-family:var(--font-mono); font-size:10px; letter-spacing:3px; text-transform:uppercase;
    color:var(--glow); opacity:0.8; margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:''; width:6px; height:6px; background:currentColor; box-shadow:0 0 8px currentColor; display:inline-block;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:0.5px;}

  .head{margin-bottom:14px;}
  .head-top{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:14px;}
  .title{font-size:26px; color:#fff; letter-spacing:0.5px; display:flex; align-items:center; gap:12px; font-weight:700;}
  .title small{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); letter-spacing:2px;}
  .rank-badge{
    font-family:var(--font-display); font-weight:700; font-size:14px; padding:5px 13px;
    border:1px solid currentColor; border-radius:var(--radius); letter-spacing:2px; text-shadow:0 0 10px currentColor;
    background:linear-gradient(180deg, color-mix(in srgb, currentColor 14%, transparent), transparent);
  }
  .hunter-stats{display:flex; gap:22px; flex-wrap:wrap; align-items:baseline; margin-bottom:10px;}
  /* En-tête compact (tous les onglets sauf "Aujourd'hui") : rang + streak au même endroit
     que la barre XP, sans reprendre tout le bloc de stats. */
  .panel.head.compact{padding-top:14px; padding-bottom:14px;}
  .panel.head.compact .head-top{margin-bottom:12px;}
  .compact-streak{
    font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:1px;
    display:flex; align-items:center;
  }
  .stat{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); letter-spacing:1px;}
  .stat b{color:var(--cyan); font-family:var(--font-display); font-size:19px; font-weight:700; margin-right:4px; text-shadow:0 0 12px rgba(34,229,255,0.35);}
  .xp-row{display:flex; align-items:center; gap:12px;}
  .xp-track{flex:1; height:15px; background:#050a14; border:1px solid var(--line); border-radius:999px; position:relative; overflow:hidden;}
  .xp-fill{height:100%; background:linear-gradient(90deg, var(--glow-dim), var(--cyan)); box-shadow:0 0 12px var(--cyan); transition:width .5s ease; position:relative; overflow:hidden; border-radius:999px;}
  @keyframes shimmerSweep{0%{transform:translateX(-100%);} 100%{transform:translateX(400%);}}
  .xp-fill::after{content:''; position:absolute; top:0; bottom:0; width:30%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); animation:shimmerSweep 2.8s ease-in-out infinite;}
  .xp-track::after{content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent, transparent 18px, rgba(0,0,0,0.25) 18px, rgba(0,0,0,0.25) 19px);}
  .xp-label{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); white-space:nowrap;}

  /* ---------- tabs ---------- */
  .tabbar-wrap{position:relative; margin:16px 0;}
  .tabbar-wrap::before, .tabbar-wrap::after{
    content:''; position:absolute; top:0; bottom:2px; width:26px; pointer-events:none; z-index:2;
    opacity:1; transition:opacity .15s;
  }
  .tabbar-wrap::before{left:0; background:linear-gradient(90deg, var(--bg), transparent);}
  .tabbar-wrap::after{right:0; background:linear-gradient(270deg, var(--bg), transparent);}
  .tabbar-wrap.scroll-start::before{opacity:0;}
  .tabbar-wrap.scroll-end::after{opacity:0;}
  .tabbar{
    display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    padding-bottom:2px;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex-shrink:0; font-family:var(--font-display); font-weight:600; font-size:12.5px; letter-spacing:0.5px;
    background:rgba(47,184,255,0.045); border:1px solid var(--line); color:var(--text-dim); border-radius:999px;
    padding:9px 16px; cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .tab-btn.active{border-color:var(--glow); color:#fff; background:linear-gradient(180deg, rgba(47,184,255,0.22), rgba(47,184,255,0.1)); box-shadow:0 0 14px rgba(47,184,255,0.3), inset 0 0 10px rgba(47,184,255,0.15);}
  .tab-btn:hover{color:var(--text); border-color:var(--text-dim);}
  .tab-btn:active{transform:scale(0.97);}
  .tab-btn.small{padding:7px 12px !important; font-size:11px !important;}

  .grid{display:grid; grid-template-columns: 1fr 1fr; gap:16px;}
  .grid > .full{grid-column: 1 / -1;}
  @media (max-width: 820px){ .grid{grid-template-columns:1fr;} }

  .panel h2{font-size:16px; color:#fff; letter-spacing:1px; margin-bottom:2px;}
  .sub{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-bottom:14px; letter-spacing:1px;}

  #radarWrap{display:flex; justify-content:center;}

  .avatar-panel{display:flex; gap:20px; align-items:center; flex-wrap:wrap;}
  .avatar-box{flex-shrink:0; width:160px; display:flex; justify-content:center;}
  .avatar-info{flex:1; min-width:200px;}
  .avatar-title{font-family:var(--font-display); font-size:20px; color:#fff;}
  .avatar-rank-line{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin:4px 0 12px; letter-spacing:1px;}
  .rank-track{display:flex; gap:4px; margin-top:10px;}
  .rank-seg{flex:1; height:6px; background:#050a14; border:1px solid var(--line); border-radius:999px;}
  .rank-seg.filled{background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  @keyframes auraPulse{0%,100%{opacity:.55; transform:scale(1);} 50%{opacity:.9; transform:scale(1.05);}}
  @keyframes floatParticle{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  .aura-ring{animation:auraPulse 2.4s ease-in-out infinite; transform-origin:center;}
  .particle{animation:floatParticle 2.2s ease-in-out infinite;}

  .skill-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-family:var(--font-display); font-weight:600; font-size:14px; width:118px; flex-shrink:0; color:var(--text);}
  .skill-identity{font-family:var(--font-mono); font-size:8.5px; color:var(--text-faint); width:118px; margin-top:2px; line-height:1.3;}
  .skill-bar-wrap{flex:1;}
  .skill-track{height:8px; background:#050a14; border:1px solid var(--line); border-radius:999px; overflow:hidden;}
  .skill-fill{height:100%; background:linear-gradient(90deg, var(--glow-dim), var(--glow));}
  .skill-meta{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); margin-top:3px;}
  .rank-chip{font-family:var(--font-mono); font-size:10px; padding:2px 7px; border:1px solid currentColor; border-radius:var(--radius); flex-shrink:0;}
  .icon-btn{
    background:rgba(255,255,255,0.02); border:1px solid var(--line); color:var(--text-dim); width:27px; height:27px;
    border-radius:var(--radius); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; flex-shrink:0;
    font-family:var(--font-mono); transition:.15s;
  }
  .icon-btn:hover{border-color:var(--glow); color:var(--cyan); background:rgba(47,184,255,0.08);}
  .icon-btn.danger:hover{border-color:var(--danger); color:var(--danger); background:rgba(255,77,94,0.08);}

  .btn{
    font-family:var(--font-display); font-weight:600; letter-spacing:1px; font-size:13px;
    background:linear-gradient(180deg, rgba(47,184,255,0.14), rgba(47,184,255,0.05)); border:1px solid var(--glow-dim); color:var(--cyan);
    border-radius:var(--radius); padding:10px 16px; cursor:pointer; transition:.15s;
  }
  .btn:hover{background:linear-gradient(180deg, rgba(47,184,255,0.24), rgba(47,184,255,0.1)); border-color:var(--glow); box-shadow:0 0 14px rgba(47,184,255,0.18);}
  .btn:active{transform:scale(0.98);}
  .btn.wide{width:100%; margin-top:12px;}
  .btn.small{padding:5px 10px; font-size:11px;}
  .btn.ghost{background:none; border-color:var(--line); color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text); border-color:var(--text-dim); box-shadow:none; background:rgba(255,255,255,0.03);}
  .btn.danger-outline{border-color:rgba(255,77,94,0.4); color:var(--danger); background:none;}
  .btn.danger-outline:hover{background:rgba(255,77,94,0.1); box-shadow:0 0 14px rgba(255,77,94,0.18);}

  .pomo-timer{font-family:var(--font-display); font-size:60px; text-align:center; color:#fff; letter-spacing:2px; text-shadow:0 0 24px rgba(47,184,255,0.35); margin:6px 0 4px;}
  .pomo-mode{text-align:center; font-family:var(--font-mono); font-size:11px; letter-spacing:3px; color:var(--glow); margin-bottom:16px;}
  .pomo-mode.break{color:var(--purple);}
  .pomo-controls{display:flex; gap:10px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;}
  .pomo-goal-track{display:flex; gap:4px; margin:10px 0;}
  .pomo-goal-seg{flex:1; height:8px; background:#050a14; border:1px solid var(--line); border-radius:999px;}
  .pomo-goal-seg.filled{background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .field-row{display:flex; gap:10px; margin-bottom:10px; align-items:center;}
  .field-row label{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); width:110px; flex-shrink:0;}
  select, input[type=text], input[type=number], input[type=date], input[type=time]{
    background:#050a14; border:1px solid var(--line); border-radius:var(--radius); color:var(--text); padding:8px 9px;
    font-family:var(--font-body); font-size:13px; width:100%;
  }
  select:focus, input:focus{outline:none; border-color:var(--glow);}
  /* ---------- Build 76 ---------- */
  .xp-float{position:fixed; z-index:150; transform:translate(-50%,-50%); pointer-events:none; text-align:center; line-height:1; animation:xpFly 1.25s cubic-bezier(.2,.8,.3,1) forwards;}
  .xp-float b{display:block; font-family:var(--font-display); font-weight:800; font-size:34px; letter-spacing:.5px; color:var(--ok); text-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 18px color-mix(in srgb, var(--ok) 70%, transparent);}
  .xp-float span{display:block; margin-top:3px; font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:var(--text-dim); text-shadow:0 1px 0 rgba(0,0,0,.6);}
  @keyframes xpFly{0%{opacity:0; transform:translate(-50%,-30%) scale(.55);} 14%{opacity:1; transform:translate(-50%,-60%) scale(1.22);} 28%{transform:translate(-50%,-75%) scale(1);} 75%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-190%) scale(.95);}}
  body.theme-manhwa .xp-float b{color:#111; text-shadow:3px 3px 0 #d7263d;}
  @media (prefers-reduced-motion: reduce){ .xp-float{animation:xpFade 1.2s ease forwards;} @keyframes xpFade{0%,70%{opacity:1;} 100%{opacity:0;}} }
  .rk{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; width:100%; height:100%; padding:6px 0; box-sizing:border-box; align-self:stretch;}
  .rk-ring{position:relative; width:var(--rs); height:var(--rs); flex:none; color:var(--text);}
  .rk-ring svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .rk-ring .rk-cur{filter:drop-shadow(0 0 3px currentColor);}
  .rk-mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; gap:1px;}
  .rk-lab{font-family:var(--font-mono); font-size:7px; letter-spacing:2px; color:var(--text-dim);}
  .rk-letter{font-family:var(--font-display); font-weight:700; font-size:calc(var(--rs) * 0.4); color:var(--rc); text-shadow:0 0 14px color-mix(in srgb, var(--rc) 60%, transparent);}
  .rk-next{font-family:var(--font-mono); font-size:9px; color:var(--text-dim); white-space:nowrap;} .rk-next b{color:var(--nc); font-weight:700;}
  .mo-portrait .rk{padding:8px 0 6px;}
  .mh-portrait .rk{padding:10px 0; background:rgba(255,255,255,0.6);}
  body.theme-manhwa .rk-letter{text-shadow:none;} body.theme-manhwa .rk-next{color:#111; font-weight:700;}
  .dj-portrait .rk{padding-top:14px;}
  .ep-rank{flex:none; width:78px;} .ep-rank .rk{padding:0;}
  .mo-chip.ok{color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent);}
  .sy-ok{color:#6be3a0;}
  .mh-xp span, .dj-xp span{color:var(--ok); font-weight:700;}
  .rank-badge-img{position:relative; aspect-ratio:340/600; flex-shrink:0;}
  .rank-badge-img img{position:relative; z-index:1; width:100%; height:100%; display:block; user-select:none; animation:rbiFloat 5s ease-in-out infinite; filter:drop-shadow(0 0 10px color-mix(in srgb, var(--g) 55%, transparent));}
  .rank-badge-img .rbi-glow{position:absolute; inset:18% 8%; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--g) 35%, transparent), transparent 70%); animation:rbiPulse 3.2s ease-in-out infinite;}
  @keyframes rbiFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
  @keyframes rbiPulse{0%,100%{opacity:.55; transform:scale(.95);} 50%{opacity:1; transform:scale(1.05);}}
  body.theme-manhwa .rank-badge-img{background:#0b0816; border-radius:14px; box-shadow:4px 4px 0 #111;}
  @media (prefers-reduced-motion: reduce){ .rank-badge-img img, .rank-badge-img .rbi-glow{animation:none;} }

  .stats-share-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  #fxOverlay{display:none;}
  #fxOverlay.on{display:flex; position:fixed; inset:0; z-index:190; align-items:center; justify-content:center; background:rgba(2,3,8,0.94); animation:ruFade .35s ease; --rc:var(--cyan);}
  #fxOverlay.out{animation:ruOut .45s ease forwards;}
  .aw-scan{position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(90,170,255,0.05) 0 1px, transparent 1px 4px); pointer-events:none;}
  .aw-win{position:relative; width:min(92vw, 420px); padding:26px 22px 22px; border:1px solid #3fa9ff; background:rgba(6,20,43,0.92); box-shadow:0 0 30px rgba(63,169,255,0.45), inset 0 0 30px rgba(63,169,255,0.15); animation:awIn .6s cubic-bezier(.2,1.2,.3,1);}
  @keyframes awIn{0%{transform:scaleY(0.02); opacity:.4;} 60%{transform:scaleY(1.03); opacity:1;} 100%{transform:scaleY(1);}}
  .aw-lines{min-height:210px; font-family:var(--font-mono); font-size:14px; line-height:1.7; color:#d9ecff;}
  .aw-line.sys{text-align:center; color:#7fd4ff; letter-spacing:4px; margin-bottom:10px; text-shadow:0 0 10px #3fa9ff;}
  .aw-line.dim{color:#7d9cc0;} .aw-line.warn{color:#ff6b7a;} .aw-line.strong{color:#fff; font-weight:700; margin-top:6px;}
  .aw-actions{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:16px; opacity:0; transform:translateY(8px); transition:.4s;} .aw-actions.show{opacity:1; transform:none;}
  .rp-stage{text-align:center; font-family:var(--font-display); width:min(92vw,420px);}
  .rp-top{font-family:var(--font-mono); font-size:12px; letter-spacing:6px; color:var(--rc); text-shadow:0 0 12px var(--rc);}
  .rp-badge{display:flex; justify-content:center; margin:10px 0 4px; min-height:284px;}
  .rp-lvl{font-size:22px; letter-spacing:4px; color:var(--text-dim);} .rp-lvl b{font-size:64px; color:#fff; display:block; line-height:1; text-shadow:0 0 24px var(--rc);}
  .rp-rank{font-size:16px; letter-spacing:4px; font-weight:700; margin-top:6px;}
  .rp-days{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:10px; letter-spacing:2px;}
  .rp-bar{height:6px; border-radius:999px; background:rgba(255,255,255,0.08); margin:10px 20px 0; overflow:hidden;} .rp-bar div{height:100%; width:0; background:var(--rc); box-shadow:0 0 10px var(--rc);}
  .rp-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; opacity:0; transition:.4s;} .rp-actions.show{opacity:1;}
  #fxOverlay.flash::after{content:''; position:absolute; inset:0; background:#fff; pointer-events:none; animation:rpFlash .45s ease forwards;}
  @keyframes rpFlash{0%{opacity:.85;} 100%{opacity:0;}}
  .card-preview{display:flex; justify-content:center; margin:6px 0 4px;} .card-preview img{width:min(62vw, 250px); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .card-loading{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); padding:40px 0;}
  .pomo-count{text-align:center; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:4px;}
  .pomo-intent{margin:0 auto 12px; max-width:320px;}
  .pomo-quest{margin:14px 0 18px; padding:12px 14px 13px; border-radius:14px; text-align:left;
    background:linear-gradient(135deg, rgba(47,184,255,0.10), rgba(162,107,255,0.08)); border:1px solid rgba(47,184,255,0.28);}
  .pomo-quest .pq-top{display:flex; align-items:center; justify-content:space-between;}
  .pomo-quest .pq-label{font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:var(--cyan);}
  .pomo-quest .pq-x{background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; padding:2px 4px; line-height:1;}
  .pomo-quest .pq-name{font-size:17px; font-weight:700; color:var(--text); margin:4px 0 7px; line-height:1.25;}
  .pomo-quest .pq-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:11px; color:var(--text-dim);}
  .pomo-quest .pq-chip{padding:2px 8px; border-radius:20px; border:1px solid rgba(47,184,255,0.35); color:var(--cyan); letter-spacing:.5px;}
  .pq-ico{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; display:block;}
  .pomo-intent input{text-align:center; font-size:13px;}
  .pomo-intent-show{text-align:center; font-size:14px; color:var(--text); margin:-4px auto 12px; max-width:340px; line-height:1.4;}
  .pomo-combo{text-align:center; font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--text-faint); margin:0 0 14px;}
  .pomo-combo.on{color:var(--gold, #ffd166); text-shadow:0 0 10px rgba(255,209,102,0.45); font-size:11px;}
  .pomo-review{margin:0 0 14px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:rgba(47,184,255,0.05);}
  .pomo-review-q{font-size:12.5px; margin-bottom:8px; text-align:center;}
  .pomo-review-btns{display:flex; gap:6px; justify-content:center; align-items:center; flex-wrap:wrap;}
  .pomo-push-hint{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); text-align:center; line-height:1.5; margin-top:10px;}
  /* Plein écran : le minuteur occupe tout l'écran, le reste de l'app est masqué. */
  body .panel.pomo-panel.pomo-full{position:fixed; inset:0; z-index:70; max-width:none; margin:0; border-radius:0; border:none;
    display:flex; flex-direction:column; justify-content:center; align-items:stretch; padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background:var(--bg) !important; box-shadow:none !important; backdrop-filter:none; -webkit-backdrop-filter:none; transform:none; overflow:auto;}
  .pomo-panel.pomo-full .pomo-hide-fs{display:none !important;}
  .pomo-panel.pomo-full .pomo-timer{font-size:clamp(84px, 24vw, 200px); line-height:1; margin:10px 0 18px;}
  .pomo-panel.pomo-full .pomo-mode{font-size:13px; margin-bottom:8px;}
  .pomo-panel.pomo-full .pomo-intent-show{font-size:17px;}
  .pomo-panel.pomo-full .pomo-goal-track{max-width:360px; width:100%; margin:16px auto 0;}
  .pomo-panel.pomo-full .c-tl, .pomo-panel.pomo-full .c-br{display:none;}
  .radio-group{display:flex; gap:8px; width:100%;}
  .radio-opt{flex:1; text-align:center; padding:8px; border:1px solid var(--line); border-radius:var(--radius); font-family:var(--font-mono); font-size:11px; cursor:pointer; color:var(--text-dim); transition:.15s;}
  .radio-opt.active{border-color:var(--glow); color:var(--cyan); background:rgba(47,184,255,0.08);}
  .radio-opt.pri-haute.active{border-color:var(--danger); color:var(--danger); background:rgba(255,77,94,0.08);}
  .radio-opt.pri-basse.active{border-color:var(--text-dim); color:var(--text); background:rgba(92,112,147,0.1);}
  .mini-switch{position:relative; width:34px; height:18px; min-width:34px; border-radius:20px; background:var(--bg-panel-2); border:1px solid var(--line); cursor:pointer; transition:background .15s, border-color .15s;}
  .mini-switch::after{content:''; position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%; background:var(--text-faint); transition:transform .15s, background .15s;}
  .mini-switch.on{background:rgba(255,77,94,0.12); border-color:var(--danger);}
  .mini-switch.on::after{transform:translateX(16px); background:var(--danger);}
  .deadline-badge{font-family:var(--font-mono); font-weight:700; font-size:11px; padding:4px 8px; border:1px solid currentColor; border-radius:var(--radius); background:rgba(0,0,0,0.25); white-space:nowrap; flex-shrink:0; letter-spacing:0.03em;}

  .item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .pri-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .chk{
    width:22px; height:22px; border:1px solid var(--glow-dim); border-radius:var(--radius); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; transition:.15s;
  }
  .chk.done{background:var(--glow-dim); color:#fff; box-shadow:0 0 10px var(--glow);}
  .item-body{flex:1; min-width:0;}
  .item-name{font-size:13.5px; color:var(--text);}
  .item-name.done{color:var(--text-faint); text-decoration:line-through;}
  .item-meta{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap;}
  .item-meta .xp-tag{color:var(--cyan);}
  .item-meta .reward-tag{color:var(--gold);}
  .term-chip{font-family:var(--font-mono); font-size:9px; padding:1px 6px; border:1px solid var(--text-faint); border-radius:var(--radius); color:var(--text-dim);}
  .term-chip.moyen{border-color:var(--purple); color:var(--purple);}
  .streak{color:var(--gold);}
  .empty{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); padding:14px 0; text-align:center; letter-spacing:1px;}
  .plan-time{font-family:var(--font-mono); font-size:12px; color:var(--cyan); width:52px; flex-shrink:0;}

  .subtask-list{margin-top:8px; padding-left:10px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:6px;}
  .subtask-row{display:flex; align-items:center; gap:8px; cursor:pointer; font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .subtask-chk{width:15px; height:15px; border:1px solid var(--glow-dim); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:transparent;}
  .subtask-chk.done{background:var(--glow-dim); color:var(--bg);}
  .subtask-row.done span{text-decoration:line-through; color:var(--text-faint);}
  .subtask-progress{cursor:pointer;}

  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-nav .cal-title{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:0.5px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{font-family:var(--font-mono); font-size:9px; color:var(--text-faint); text-align:center; padding-bottom:4px; letter-spacing:1px;}
  .cal-day{
    position:relative; aspect-ratio:1; border:1px solid var(--line); border-radius:var(--radius); background:rgba(255,255,255,0.01);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:4px 2px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim); cursor:pointer; transition:.15s;
  }
  .cal-day:hover{border-color:var(--glow); color:var(--text);}
  .cal-day.empty-cell{border:none; background:none; cursor:default;}
  .cal-day.today{border-color:var(--glow); box-shadow:0 0 0 1px var(--glow);}
  .cal-day-dots{display:flex; gap:3px; margin-top:4px; flex-wrap:wrap; justify-content:center;}
  .cal-dot{width:5px; height:5px; border-radius:50%; flex-shrink:0;}

  .water-panel{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;}
  .bottle-box{flex-shrink:0; width:110px; display:flex; justify-content:center;}
  .water-info{flex:1; min-width:180px;}
  .water-amount{font-family:var(--font-display); font-size:24px; color:#fff;}
  .water-amount span{font-size:13px; color:var(--text-dim); font-family:var(--font-mono);}
  .water-pct{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin:2px 0 10px;}
  .water-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}

  .week-chart-row{display:flex; gap:24px; flex-wrap:wrap;}
  .week-chart-box{flex:1; min-width:220px;}
  .week-chart-title{font-family:var(--font-mono); font-size:9.5px; color:var(--text-dim); letter-spacing:1px; margin-bottom:6px;}

  .today-card{padding:14px 0; border-bottom:1px solid var(--line);}
  .today-card:last-child{border-bottom:none;}
  .today-card-title{font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-bottom:8px;}
  .tip-banner{font-family:var(--font-mono); font-size:11px; color:var(--glow); background:rgba(47,184,255,0.06); border:1px solid var(--glow-dim); border-radius:var(--radius); padding:12px 14px; line-height:1.6;}

  .overlay{position:fixed; inset:0; background:rgba(2,4,9,0.78); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .overlay.open{display:flex;}
  .modal{
    width:100%; max-width:380px; background:linear-gradient(165deg, var(--bg-panel), var(--bg-panel-2) 70%);
    border:1px solid var(--glow-dim); border-radius:var(--radius-lg); padding:22px; position:relative; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.7), 0 0 40px rgba(47,184,255,0.08);
    animation: modalIn .2s ease;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  .modal h3{font-size:16px; color:#fff; margin-bottom:16px; letter-spacing:1px;}
  .modal .field-row label{width:80px;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1;}

  #toastZone{position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:10px; align-items:center; padding:0 16px; width:100%; max-width:400px;}
  .toast{
    font-family:var(--font-display); font-weight:700; text-align:center; padding:14px 30px;
    background:linear-gradient(180deg, rgba(10,17,32,0.97), rgba(13,21,38,0.97));
    border:1px solid var(--glow); border-radius:var(--radius-lg); box-shadow:0 12px 30px -8px rgba(0,0,0,0.6), 0 0 30px rgba(47,184,255,0.5), inset 0 0 20px rgba(47,184,255,0.08);
    animation: toastIn .35s ease, toastOut .5s ease 2.8s forwards;
    min-width:240px;
  }
  .toast .tt{font-size:11px; letter-spacing:4px; color:var(--glow);}
  .toast .tn{font-size:20px; color:#fff; margin-top:4px; text-shadow:0 0 14px var(--cyan);}
  .toast .tr{font-size:11px; color:var(--gold); margin-top:4px; font-family:var(--font-mono); font-weight:400;}
  .toast-penalty{border-color:var(--danger); box-shadow:0 0 30px rgba(255,77,94,0.5), inset 0 0 20px rgba(255,77,94,0.08);}
  .toast-penalty .tt{color:var(--danger);}
  .toast-penalty .tr{color:var(--danger);}
  @keyframes toastIn{from{opacity:0; transform:translateY(-16px) scale(.9);} to{opacity:1; transform:translateY(0) scale(1);}}
  @keyframes toastOut{to{opacity:0; transform:translateY(-10px);}}

  /* ===== QUEST COMPLETE BURST ===== */
  .qb-ring{position:fixed; z-index:90; pointer-events:none; width:22px; height:22px; margin:-11px 0 0 -11px; border:2px solid var(--cyan); border-radius:50%; box-shadow:0 0 14px var(--cyan); animation:qbRing .45s ease-out forwards;}
  @keyframes qbRing{0%{opacity:1; transform:scale(.6);} 100%{opacity:0; transform:scale(3.2);}}
  .qb-p{position:fixed; z-index:90; pointer-events:none; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; border-radius:50%; background:var(--c,var(--cyan)); box-shadow:0 0 8px var(--c,var(--cyan)); animation:qbP .5s cubic-bezier(.1,.8,.3,1) forwards;}
  @keyframes qbP{0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--x),var(--y)) scale(.2);}}
  @media (prefers-reduced-motion: reduce){ .qb-ring,.qb-p{display:none;} }

  /* ===== RANK-UP CINEMATIC ===== */
  #rankUp{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; overflow:hidden; background:rgba(2,4,9,0.92); cursor:pointer; --rc:var(--cyan);}
  #rankUp.on{display:flex; animation:ruFade .35s ease, ruShake .6s ease .55s;}
  #rankUp.out{animation:ruOut .6s ease forwards;}
  @keyframes ruFade{from{opacity:0;} to{opacity:1;}}
  @keyframes ruOut{to{opacity:0;}}
  @keyframes ruShake{0%,100%{transform:translate(0,0);} 15%{transform:translate(-7px,4px);} 30%{transform:translate(6px,-5px);} 45%{transform:translate(-5px,-3px);} 60%{transform:translate(4px,5px);} 80%{transform:translate(-2px,1px);}}
  .ru-glow{position:absolute; width:120vmax; height:120vmax; background:radial-gradient(circle, color-mix(in srgb, var(--rc) 45%, transparent) 0%, transparent 55%); opacity:0; animation:ruGlow 4s ease forwards;}
  @keyframes ruGlow{0%{opacity:0; transform:scale(.2);} 25%{opacity:1; transform:scale(1);} 100%{opacity:.5; transform:scale(1.1);}}
  .ru-rays{position:absolute; width:150vmax; height:150vmax; background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 30%, transparent) 0deg 4deg, transparent 4deg 15deg); -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 60%); mask-image:radial-gradient(circle, #000 0%, transparent 60%); opacity:0; animation:ruRays 4s linear forwards;}
  @keyframes ruRays{0%{opacity:0; transform:rotate(0) scale(.3);} 20%{opacity:.9;} 100%{opacity:.35; transform:rotate(60deg) scale(1);}}
  .ru-ring{position:absolute; width:40px; height:40px; border:3px solid var(--rc); border-radius:50%; opacity:0; box-shadow:0 0 30px var(--rc), inset 0 0 20px var(--rc);}
  .ru-ring.r1{animation:ruRing 1.4s ease-out .5s forwards;}
  .ru-ring.r2{animation:ruRing 1.4s ease-out .8s forwards;}
  .ru-ring.r3{animation:ruRing 1.4s ease-out 1.1s forwards;}
  @keyframes ruRing{0%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(28);}}
  .ru-stage{position:relative; text-align:center; font-family:var(--font-display); z-index:2; padding:0 20px;}
  .ru-top{font-size:12px; letter-spacing:8px; color:var(--rc); opacity:0; animation:ruTop .8s ease .2s forwards; text-shadow:0 0 14px var(--rc);}
  @keyframes ruTop{from{opacity:0; letter-spacing:22px;} to{opacity:1; letter-spacing:8px;}}
  .ru-letters{position:relative; height:190px; display:flex; align-items:center; justify-content:center; margin:6px 0;}
  .ru-old,.ru-new{position:absolute; font-weight:700; line-height:1;}
  .ru-old{font-size:110px; color:var(--text-dim); animation:ruOld 1s ease .1s forwards;}
  @keyframes ruOld{0%{opacity:1; transform:scale(1); filter:blur(0);} 60%{opacity:1; transform:scale(1.15); filter:blur(0); color:#fff;} 100%{opacity:0; transform:scale(2.4); filter:blur(14px);}}
  .ru-new{font-size:170px; color:var(--rc); opacity:0; text-shadow:0 0 30px var(--rc), 0 0 80px var(--rc); animation:ruNew 1.1s cubic-bezier(.2,1.4,.3,1) .6s forwards, ruBreath 2.2s ease-in-out 1.8s infinite;}
  @keyframes ruNew{0%{opacity:0; transform:scale(5); filter:blur(18px);} 55%{opacity:1; transform:scale(.88); filter:blur(0);} 100%{opacity:1; transform:scale(1); filter:blur(0);}}
  @keyframes ruBreath{0%,100%{text-shadow:0 0 30px var(--rc), 0 0 80px var(--rc);} 50%{text-shadow:0 0 50px var(--rc), 0 0 130px var(--rc);}}
  .ru-title{font-size:26px; letter-spacing:6px; color:#fff; font-weight:700; opacity:0; text-shadow:0 0 18px var(--rc); animation:ruUp .7s ease 1.3s forwards;}
  .ru-sub{font-family:var(--font-mono); font-size:12px; letter-spacing:3px; color:var(--gold); margin-top:10px; opacity:0; animation:ruUp .7s ease 1.6s forwards;}
  .ru-hint{font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--text-faint); margin-top:26px; opacity:0; animation:ruUp .7s ease 2.6s forwards;}
  @keyframes ruUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .ru-p{position:absolute; left:50%; top:50%; width:var(--s,5px); height:var(--s,5px); background:var(--rc); border-radius:50%; box-shadow:0 0 10px var(--rc); opacity:0; animation:ruP 1.6s cubic-bezier(.1,.7,.3,1) var(--d,.6s) forwards;}
  @keyframes ruP{0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--x),var(--y)) scale(.2);}}
  @media (prefers-reduced-motion: reduce){ #rankUp.on{animation:ruFade .2s ease;} .ru-rays,.ru-ring,.ru-p{display:none;} .ru-new{animation:ruNewSoft .5s ease .3s forwards;} @keyframes ruNewSoft{to{opacity:1;}} }


  .foot-row{display:flex; justify-content:space-between; align-items:center; margin-top:22px; flex-wrap:wrap; gap:10px;}
  .foot-note{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:0.5px;}
  #loading{font-family:var(--font-mono); color:var(--text-dim); text-align:center; padding:80px 20px; letter-spacing:2px; font-size:12px;}
  #installHint{display:none; font-family:var(--font-mono); font-size:10.5px; color:var(--glow); background:rgba(47,184,255,0.06); border:1px solid var(--glow-dim); padding:10px 14px; margin-bottom:16px; text-align:center; letter-spacing:0.5px;}
  .fab{
    position:fixed; right:20px; bottom:max(24px, env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, var(--glow-dim), var(--cyan)); box-shadow:0 4px 20px rgba(47,184,255,0.5);
    display:flex; align-items:center; justify-content:center; font-size:28px; color:#05070c; border:none;
    cursor:pointer; z-index:40; font-family:var(--font-display); font-weight:700;
  }

  /* ===== MODE CLASSIQUE (Réglages > Affichage > Style visuel) =====
     Restaure fidèlement le look d'origine (angles droits, aplats, sans dégradés/profondeur)
     pour qui préfère l'ancienne version. Les deux modes cohabitent dans le même fichier —
     seule la classe .theme-classic sur <body> bascule de l'un à l'autre, sans rien recharger. */
  body.theme-classic{
    --bg: #05070c;
    --bg-panel: #0a1120;
    --bg-panel-2: #0d1526;
    --line: #1b2942;
    --text: #dce8fa;
    --text-dim: #5c7093;
    --text-faint: #35435f;
    --radius: 0;
    --radius-lg: 0;
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(47,184,255,0.12), transparent 45%),
      radial-gradient(ellipse at 90% 110%, rgba(155,107,255,0.10), transparent 50%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
  body.theme-classic .panel{
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 0 0 1px rgba(47,184,255,0.03), inset 0 0 40px rgba(47,184,255,0.02);
  }
  body.theme-classic .panel::before{display:none;}
  body.theme-classic .panel .c-tl, body.theme-classic .panel .c-br{width:14px; height:14px;}
  body.theme-classic .panel .c-tl::after, body.theme-classic .panel .c-br::after{display:none;}
  body.theme-classic .title{font-size:24px; letter-spacing:1px; font-weight:400;}
  body.theme-classic .rank-badge{background:none;}
  body.theme-classic .stat b{font-size:18px; text-shadow:none;}
  body.theme-classic .xp-track, body.theme-classic .xp-fill{border-radius:0;}
  body.theme-classic .xp-track{height:14px;}
  body.theme-classic .tab-btn{border-radius:0; padding:9px 14px; background:rgba(47,184,255,0.04);}
  body.theme-classic .tab-btn.active{background:rgba(47,184,255,0.14); box-shadow:0 0 12px rgba(47,184,255,0.25);}
  body.theme-classic .tab-btn:hover{border-color:var(--line);}
  body.theme-classic .tab-btn:active{transform:none;}
  body.theme-classic .rank-seg, body.theme-classic .skill-track, body.theme-classic .pomo-goal-seg{border-radius:0;}
  body.theme-classic .icon-btn{background:none; width:26px; height:26px;}
  body.theme-classic .icon-btn:hover, body.theme-classic .icon-btn.danger:hover{background:none;}
  body.theme-classic .btn{background:rgba(47,184,255,0.07);}
  body.theme-classic .btn:hover{background:rgba(47,184,255,0.16); box-shadow:none;}
  body.theme-classic .btn:active{transform:none;}
  body.theme-classic .btn.ghost:hover{background:none; box-shadow:none;}
  body.theme-classic .btn.danger-outline:hover{background:rgba(255,77,94,0.08); box-shadow:none;}
  body.theme-classic .overlay{background:rgba(2,4,9,0.75); backdrop-filter:blur(2px);}
  body.theme-classic .modal{background:var(--bg-panel); box-shadow:none; animation:none;}
  body.theme-classic .toast{box-shadow:0 0 30px rgba(47,184,255,0.5), inset 0 0 20px rgba(47,184,255,0.08);}
  body.theme-classic .toast-penalty{box-shadow:0 0 30px rgba(255,77,94,0.5), inset 0 0 20px rgba(255,77,94,0.08);}

  /* ===== Onglets : double habillage (voir tabBar) ===== */
  .tab-btn .tb-emoji{margin-right:6px;}
  .tab-btn .tb-svg, .tab-btn .tb-short{display:none;}
  textarea{
    background:#050a14; border:1px solid var(--line); border-radius:var(--radius); color:var(--text); padding:8px 9px;
    font-family:var(--font-body); font-size:13px; width:100%; resize:vertical; line-height:1.45;
  }
  textarea:focus{outline:none; border-color:var(--glow);}

  /* ===== Écussons de succès (tous les styles) ===== */
  .ach-tiers{display:flex; flex-wrap:wrap; gap:6px 14px; margin:4px 0 14px;}
  .ach-tier-count{display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:.5px;}
  .ach-tier-count b{font-family:var(--font-display); font-size:14px; color:var(--text);}
  .ach-tier-dot{width:12px; height:14px; clip-path:polygon(50% 0,100% 14%,100% 55%,50% 100%,0 55%,0 14%); display:inline-block;}
  .ach-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); gap:10px; margin-top:6px;}
  .ach-card{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px; text-align:center;
    background:rgba(255,255,255,0.015); border:1px solid var(--line); border-radius:var(--radius-lg); cursor:pointer;
    color:inherit; font:inherit; transition:transform .15s, border-color .15s, background .15s;
  }
  .ach-card:hover{border-color:var(--text-faint);}
  .ach-card:active{transform:scale(.97);}
  .ach-card.on{background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.05), transparent 70%), rgba(255,255,255,0.02);}
  .ach-card:not(.on) .ach-shield{opacity:.85;}
  .ach-shield{display:block; flex-shrink:0;}
  .ach-name{font-family:var(--font-display); font-weight:600; font-size:11.5px; line-height:1.2; color:var(--text); min-height:2.4em; display:flex; align-items:center;}
  .ach-card:not(.on) .ach-name{color:var(--text-dim);}
  .ach-foot{font-family:var(--font-mono); font-size:9px; color:var(--text-faint); letter-spacing:1px;}
  .ach-prog{width:78%; height:4px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .ach-prog.big{width:100%; height:6px;}
  .ach-prog > div{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--glow-dim), var(--glow));}

  /* ===== Serment Inné ===== */
  .oath-panel{background:radial-gradient(ellipse at 100% 0%, rgba(255,201,77,0.08), transparent 55%), linear-gradient(165deg, var(--bg-panel), var(--bg-panel-2) 65%);}
  .oath-quote{font-family:var(--font-display); font-size:19px; line-height:1.35; color:#fff; font-weight:600; margin:4px 0 6px;}
  .oath-by{font-family:var(--font-mono); font-size:10px; color:var(--gold); letter-spacing:1px;}
  .oath-lead{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin-top:6px;}
  .oath-reminder{display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:14px; border:1px solid rgba(255,201,77,0.28); border-radius:var(--radius-lg); background:rgba(255,201,77,0.05); cursor:pointer;}
  .oath-reminder-tag{font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--gold); flex-shrink:0;}
  .oath-reminder-text{font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .oath-row{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);}
  .oath-row:last-child{border-bottom:none;}
  .oath-row.me .item-name{color:var(--gold);}
  .oath-pos{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--text-faint); width:22px; text-align:center; flex-shrink:0;}
  .oath-row:nth-child(1) .oath-pos{color:var(--gold);}
  .oath-row:nth-child(2) .oath-pos{color:#cbd5e1;}
  .oath-row:nth-child(3) .oath-pos{color:#d69256;}
  .oath-lvl{font-family:var(--font-mono); font-size:9px; color:var(--text-dim); letter-spacing:1px;}
  .oath-row-text{font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.4;}


  /* ===== Badge de rang (tous les styles) ===== */
  .rank-badge-frame{position:relative; aspect-ratio:340/440; flex-shrink:0;}
  .rank-badge-frame > svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .rb-glow{position:absolute; left:5.9%; top:9.1%; width:88.2%; height:86.4%; border-radius:50%;}
  .rb-rays{position:absolute; left:-2.9%; top:4.5%; width:105.9%; height:81.8%; border-radius:50%;
    -webkit-mask-image:radial-gradient(circle, #000 30%, transparent 70%); mask-image:radial-gradient(circle, #000 30%, transparent 70%);
    animation:rbSpin 40s linear infinite;}
  .rb-window{position:absolute; left:22.94%; top:18.18%; width:54.12%; height:74.09%; border-radius:50% 50% 0 0 / 28.2% 28.2% 0 0; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;}
  .rb-window img{height:94%; width:auto; image-rendering:pixelated; display:block;}
  .rb-sigil{width:100%; height:100%; padding:10% 4%; box-sizing:border-box;}
  .rb-p{position:absolute; border-radius:50%; animation:floatParticle 2.4s ease-in-out infinite;}
  .rb-fire{animation:rbFlicker 1.6s ease-in-out infinite; transform-origin:50% 100%;}
  @keyframes rbSpin{to{transform:rotate(360deg);}}
  @keyframes rbFlicker{0%,100%{transform:scaleY(1); opacity:.9;} 50%{transform:scaleY(1.04); opacity:1;}}
  .head .rank-badge-frame .rb-p{display:none;}
  @media (prefers-reduced-motion: reduce){ .rb-rays,.rb-fire,.rb-p{animation:none;} }

  /* ===== Navigation en bas (styles Monarque, Système, Manhwa, Donjon, Épuré) ===== */
  body.nav-bottom{padding-bottom:calc(112px + env(safe-area-inset-bottom));}
  body.nav-bottom .tabbar-wrap{position:fixed; left:0; right:0; bottom:0; z-index:45; margin:0;}
  body.nav-bottom .tabbar-wrap::before, body.nav-bottom .tabbar-wrap::after{display:none;}
  body.nav-bottom .tabbar{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:2px; overflow:visible; padding:6px 4px calc(10px + env(safe-area-inset-bottom));}
  body.nav-bottom .tabbar .tab-btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:0; padding:7px 0 6px; border-radius:0; font-size:9px; box-shadow:none;}
  body.nav-bottom .tabbar .tab-btn .tb-emoji, body.nav-bottom .tabbar .tab-btn .tb-lbl{display:none;}
  body.nav-bottom .tabbar .tab-btn .tb-svg{display:block; width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  body.nav-bottom .tabbar .tab-btn .tb-short{display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  body.nav-bottom .fab{bottom:calc(88px + env(safe-area-inset-bottom));}
  body.nav-bottom .panel.head .hunter-stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; align-items:stretch; margin:4px 0 16px;}
  body.nav-bottom .panel.head .stat{display:flex; flex-direction:column-reverse; justify-content:flex-start; gap:2px; text-align:center; padding:10px 4px; font-size:8.5px; letter-spacing:1px;}
  body.nav-bottom .panel.head .stat b{margin:0; white-space:nowrap; font-size:19px;}
  body.nav-bottom .water-grid .btn{padding-left:2px; padding-right:2px; min-width:0;}


  /* =====================================================================
     STYLE « MONARQUE » — refonte (Réglages > Affichage > Style visuel)
     Violet des Ombres, panneaux en verre dépoli, typographie Cinzel/Sora,
     navigation en barre fixe en bas d'écran. Tout est confiné à
     body.theme-monarch : les styles Moderne et Classique restent intacts.
     ===================================================================== */
  body.theme-monarch{
    --bg:#07060d;
    --bg-panel:rgba(27,21,46,0.72);
    --bg-panel-2:rgba(13,10,24,0.82);
    --line:rgba(167,139,250,0.13);
    --glow:#a78bfa;
    --glow-dim:#6d4bd8;
    --cyan:#8fd8ff;
    --purple:#c084fc;
    --gold:#f5c451;
    --text:#eeeaf8;
    --text-dim:#9b94b8;
    --text-faint:#5d5679;
    --danger:#fb7185;
    --ok:#4ade80;
    --radius:12px;
    --radius-lg:20px;
    --font-display:'Sora', sans-serif;
    --font-body:'Sora', sans-serif;
    --font-mono:'Sora', sans-serif;
    --font-regal:'Cinzel', serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 45% at 50% -8%, rgba(124,58,237,0.30), transparent 70%),
      radial-gradient(ellipse 60% 40% at 110% 30%, rgba(76,29,149,0.22), transparent 70%),
      radial-gradient(ellipse 70% 40% at -10% 85%, rgba(56,189,248,0.07), transparent 70%);
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:calc(118px + env(safe-area-inset-bottom));
  }
  html:has(body.theme-monarch){background:#07060d;}
  body.theme-monarch .wrap{max-width:760px;}

  /* Panneaux : verre dépoli, sans les coins « HUD » */
  body.theme-monarch .panel{
    background:linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px;
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 24px 50px -28px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  body.theme-monarch .panel::before{left:24px; right:24px; background:linear-gradient(90deg, transparent, rgba(196,181,253,0.45), transparent);}
  body.theme-monarch .panel .c-tl, body.theme-monarch .panel .c-br{display:none;}
  body.theme-monarch .panel h2{font-family:var(--font-regal); font-size:17px; letter-spacing:.8px; font-weight:700;}
  body.theme-monarch h3{font-family:var(--font-regal); letter-spacing:1px;}
  body.theme-monarch .eyebrow{font-size:9.5px; letter-spacing:2.6px; font-weight:600; opacity:.9;}
  body.theme-monarch .eyebrow::before{width:5px; height:5px; transform:rotate(45deg); box-shadow:0 0 10px currentColor;}
  body.theme-monarch .sub{font-size:9.5px; letter-spacing:1.4px; font-weight:400;}

  /* En-tête (fenêtre de statut) */
  body.theme-monarch .panel.head{
    background:
      radial-gradient(ellipse 70% 90% at 100% 0%, rgba(139,92,246,0.28), transparent 60%),
      linear-gradient(160deg, rgba(30,22,54,0.85), rgba(12,9,22,0.9));
    border-color:rgba(167,139,250,0.22);
  }
  body.theme-monarch .title{font-family:var(--font-regal); font-size:30px; letter-spacing:2px; font-weight:700;
    background:linear-gradient(180deg, #ffffff 20%, #c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent;}
  body.theme-monarch .title small{font-family:var(--font-body); font-size:9.5px; letter-spacing:3px; color:var(--text-faint); -webkit-text-fill-color:var(--text-faint);}
  body.theme-monarch .rank-badge{font-family:var(--font-regal); font-size:13px; padding:6px 14px; border-radius:999px; letter-spacing:2.5px;
    background:linear-gradient(180deg, color-mix(in srgb, currentColor 22%, transparent), color-mix(in srgb, currentColor 6%, transparent));
    box-shadow:0 0 18px color-mix(in srgb, currentColor 30%, transparent);}
  body.theme-monarch .panel.head .hunter-stats{gap:8px; display:grid; grid-template-columns:repeat(4, 1fr); align-items:stretch; margin:4px 0 16px;}
  body.theme-monarch .panel.head .stat{display:flex; flex-direction:column-reverse; justify-content:flex-start; gap:2px; font-size:8.5px; letter-spacing:1.2px; color:var(--text-faint);
    padding:10px 6px; border-radius:14px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); text-align:center;}
  body.theme-monarch .stat b{font-family:var(--font-display); font-weight:600; font-size:20px; color:#fff; text-shadow:none; margin:0; white-space:nowrap;}
  body.theme-monarch .panel.head .stat b{font-size:19px;}
  body.theme-monarch .water-grid .btn{padding-left:2px; padding-right:2px; min-width:0; font-size:11px;}
  body.theme-monarch .mini-switch.on{background:rgba(139,92,246,0.25); border-color:var(--glow);}
  body.theme-monarch .mini-switch.on::after{background:var(--glow);}
  body.theme-monarch .xp-track{height:10px; background:rgba(255,255,255,0.05); border:none;}
  body.theme-monarch .xp-track::after{display:none;}
  body.theme-monarch .xp-fill{background:linear-gradient(90deg, #7c3aed, #a78bfa 60%, #8fd8ff); box-shadow:0 0 16px rgba(167,139,250,0.7);}
  body.theme-monarch .xp-label{font-size:10px; color:var(--text-dim); font-weight:600;}
  body.theme-monarch .compact-streak{font-size:12px; font-weight:600; color:var(--gold);}
  body.theme-monarch .icon-btn{border-radius:12px; background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.06); color:var(--text-dim);}
  body.theme-monarch .icon-btn:hover{border-color:var(--glow); color:#fff; background:rgba(167,139,250,0.14);}

  /* Navigation : barre flottante fixe en bas */
  body.theme-monarch .tabbar-wrap{
    position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:45; margin:0;
    max-width:560px; margin-left:auto; margin-right:auto;
  }
  body.theme-monarch .tabbar-wrap::before, body.theme-monarch .tabbar-wrap::after{display:none;}
  body.theme-monarch .tabbar{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; overflow:visible; padding:7px 6px;
    background:rgba(16,12,30,0.78); -webkit-backdrop-filter:blur(20px) saturate(1.4); backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(167,139,250,0.18); border-radius:24px;
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  body.theme-monarch .tabbar .tab-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:0;
    padding:7px 0 6px; border:none; border-radius:16px; background:none; box-shadow:none; color:var(--text-faint);
    font-family:var(--font-body); font-weight:600; font-size:9px; letter-spacing:.3px;
  }
  body.theme-monarch .tabbar .tab-btn .tb-emoji, body.theme-monarch .tabbar .tab-btn .tb-lbl{display:none;}
  body.theme-monarch .tabbar .tab-btn .tb-svg{display:block; width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  body.theme-monarch .tabbar .tab-btn .tb-short{display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  body.theme-monarch .tabbar .tab-btn:hover{color:var(--text-dim);}
  body.theme-monarch .tabbar .tab-btn.active{color:#fff; background:linear-gradient(180deg, rgba(139,92,246,0.35), rgba(109,40,217,0.18));
    box-shadow:inset 0 0 0 1px rgba(196,181,253,0.25), 0 6px 18px -6px rgba(139,92,246,0.7);}
  body.theme-monarch .tabbar .tab-btn.active .tb-svg{filter:drop-shadow(0 0 6px rgba(196,181,253,0.8));}
  /* Onglets internes (réglages) : segments arrondis */
  body.theme-monarch .tab-btn.small{border-radius:999px; font-family:var(--font-body); background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--text-dim);}
  body.theme-monarch .tab-btn.small.active{color:#fff; border-color:rgba(196,181,253,0.4); background:linear-gradient(180deg, rgba(139,92,246,0.4), rgba(109,40,217,0.2)); box-shadow:none;}
  body.theme-monarch .grid{gap:14px;}
  body.theme-monarch .tabbar-wrap + *{margin-top:0;}
  body.theme-monarch .panel.head{margin-bottom:14px;}

  /* Boutons */
  body.theme-monarch .btn{
    font-family:var(--font-body); font-weight:600; letter-spacing:.3px; font-size:13px; border-radius:14px; padding:11px 16px;
    color:#fff; border:1px solid rgba(196,181,253,0.25);
    background:linear-gradient(180deg, #8b5cf6, #6d28d9);
    box-shadow:0 8px 22px -10px rgba(124,58,237,0.9), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  body.theme-monarch .btn:hover{background:linear-gradient(180deg, #9d74f8, #7c3aed); box-shadow:0 10px 26px -10px rgba(124,58,237,1), inset 0 1px 0 rgba(255,255,255,0.2);}
  body.theme-monarch .btn.small{padding:7px 12px; font-size:11.5px; border-radius:11px;}
  body.theme-monarch .btn.ghost{background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.08); color:var(--text-dim); box-shadow:none;}
  body.theme-monarch .btn.ghost:hover{background:rgba(167,139,250,0.1); border-color:rgba(167,139,250,0.3); color:#fff;}
  body.theme-monarch .btn.danger-outline{background:rgba(251,113,133,0.06); border-color:rgba(251,113,133,0.35); color:var(--danger); box-shadow:none;}
  body.theme-monarch .fab{
    bottom:calc(98px + env(safe-area-inset-bottom)); right:18px; width:54px; height:54px; border-radius:18px;
    background:linear-gradient(145deg, #a78bfa, #6d28d9); color:#fff; font-size:26px; font-weight:300; font-family:var(--font-body);
    box-shadow:0 14px 30px -8px rgba(124,58,237,0.95), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  /* Listes, cases, champs */
  body.theme-monarch .item{border-bottom-color:rgba(255,255,255,0.05); padding:11px 0;}
  body.theme-monarch .item-name{font-size:13.5px; font-weight:400;}
  body.theme-monarch .item-meta{font-size:9.5px; letter-spacing:.3px;}
  body.theme-monarch .chk{width:24px; height:24px; border-radius:8px; border:1.5px solid rgba(167,139,250,0.45);}
  body.theme-monarch .chk.done{background:linear-gradient(145deg, #a78bfa, #6d28d9); border-color:transparent; box-shadow:0 0 14px rgba(139,92,246,0.6);}
  body.theme-monarch .subtask-chk{border-radius:5px;}
  body.theme-monarch select, body.theme-monarch input[type=text], body.theme-monarch input[type=number],
  body.theme-monarch input[type=date], body.theme-monarch input[type=time], body.theme-monarch textarea{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:10px 12px; font-family:var(--font-body);
  }
  body.theme-monarch select:focus, body.theme-monarch input:focus, body.theme-monarch textarea:focus{border-color:var(--glow); box-shadow:0 0 0 3px rgba(167,139,250,0.18);}
  body.theme-monarch .field-row label{font-size:10.5px; letter-spacing:.3px;}
  body.theme-monarch .radio-opt{border-radius:11px; font-family:var(--font-body); font-weight:600; font-size:10.5px; border-color:rgba(255,255,255,0.08); background:rgba(255,255,255,0.02);}
  body.theme-monarch .radio-opt.active{color:#fff; border-color:rgba(196,181,253,0.45); background:rgba(139,92,246,0.22);}
  body.theme-monarch .rank-chip{border-radius:7px; font-weight:600;}
  body.theme-monarch .term-chip{border-radius:7px;}
  body.theme-monarch .deadline-badge{border-radius:9px;}
  body.theme-monarch .tip-banner, body.theme-monarch #installHint{
    font-family:var(--font-body); font-size:11.5px; color:var(--text-dim); letter-spacing:.2px;
    background:rgba(139,92,246,0.08); border:1px solid rgba(167,139,250,0.2); border-radius:16px;
  }
  body.theme-monarch .empty{font-size:10.5px; letter-spacing:1.2px;}

  /* Compétences, rangs, pomodoro, calendrier */
  body.theme-monarch .skill-row{border-bottom-color:rgba(255,255,255,0.05);}
  body.theme-monarch .skill-name{font-weight:600; font-size:13.5px;}
  body.theme-monarch .skill-track{height:7px; border:none; background:rgba(255,255,255,0.05);}
  body.theme-monarch .skill-fill{background:linear-gradient(90deg, #6d28d9, #a78bfa 70%, #8fd8ff); border-radius:999px;}
  body.theme-monarch .rank-seg, body.theme-monarch .pomo-goal-seg{border:none; background:rgba(255,255,255,0.06); height:6px;}
  body.theme-monarch .rank-seg.filled, body.theme-monarch .pomo-goal-seg.filled{background:linear-gradient(90deg, #8b5cf6, #c4b5fd); box-shadow:0 0 10px rgba(139,92,246,0.6);}
  body.theme-monarch .avatar-title{font-family:var(--font-regal); font-size:22px;}
  body.theme-monarch .pomo-timer{font-family:var(--font-body); font-weight:300; font-size:66px; letter-spacing:1px;
    background:linear-gradient(180deg, #fff 30%, #c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;}
  body.theme-monarch .pomo-mode{font-weight:600; letter-spacing:3px;}
  body.theme-monarch .cal-day{border-radius:11px; border-color:rgba(255,255,255,0.05); background:rgba(255,255,255,0.02); font-family:var(--font-body);}
  body.theme-monarch .cal-day.today{border-color:var(--glow); box-shadow:0 0 0 1px var(--glow), 0 0 14px rgba(139,92,246,0.4);}

  /* =====================================================================

  body.theme-epure{
    --bg:#0d0e10; --bg-panel:#16181c; --bg-panel-2:#16181c; --line:#23262c; --glow:#c8f560; --glow-dim:#7fa33a;
    --cyan:#f2f3f5; --purple:#7cc7ff; --gold:#c8f560; --text:#f2f3f5; --text-dim:#8b9099; --text-faint:#5b606a;
    --danger:#ff7a6b; --ok:#c8f560; --radius:12px; --radius-lg:22px;
    --font-display:'Manrope', 'Inter', sans-serif; --font-body:'Manrope', 'Inter', sans-serif; --font-mono:'Manrope', 'Inter', sans-serif;
    background:#0d0e10; min-height:100vh;

  body.theme-epure .eyebrow{color:#8b9099; letter-spacing:1px; font-weight:600; font-size:10px; opacity:1;}
  body.theme-epure .eyebrow::before{display:none;}

  body.theme-epure .title{font-weight:800; font-size:28px; letter-spacing:-0.5px;}
  body.theme-epure .title small{letter-spacing:1px;}
  body.theme-epure .sub{letter-spacing:.5px;}
  body.theme-epure .rank-badge{border-radius:999px; background:#c8f560; color:#0d0e10 !important; border-color:#c8f560; text-shadow:none; font-weight:800;}
  body.theme-epure .panel.head .stat{border-radius:16px; background:#1f2227; letter-spacing:.3px; text-transform:lowercase;}
  body.theme-epure .stat b{color:#f2f3f5; text-shadow:none; font-weight:800; font-size:24px !important;}
  body.theme-epure .compact-streak{color:#c8f560; font-weight:800;}
  body.theme-epure .xp-track{background:#23262c; border:none; height:8px;}
  body.theme-epure .xp-track::after, body.theme-epure .xp-fill::after{display:none;}
  body.theme-epure .xp-fill{background:#c8f560; box-shadow:none;}
  body.theme-epure .tabbar{background:#0d0e10; border-top:1px solid #1f2227;}
  body.theme-epure .tabbar .tab-btn{background:none; border:none; color:#5b606a; font-weight:700; font-size:9.5px;}
  body.theme-epure .tabbar .tab-btn.active{color:#f2f3f5;}
  body.theme-epure .tabbar .tab-btn .tb-svg{stroke-width:2;}
  body.theme-epure .tab-btn.small{background:#1f2227; border-color:transparent; color:#8b9099;}
  body.theme-epure .tab-btn.small.active{background:#f2f3f5; color:#0d0e10; box-shadow:none; border-color:transparent;}
  body.theme-epure .btn{border-radius:12px; background:#f2f3f5; color:#0d0e10; border:none; font-weight:800; letter-spacing:0;}
  body.theme-epure .btn:hover{background:#ffffff; box-shadow:none;}
  body.theme-epure .btn.ghost{background:#23262c; color:#f2f3f5;}
  body.theme-epure .btn.danger-outline{background:rgba(255,122,107,0.12); color:#ff7a6b; border:none;}
  body.theme-epure .icon-btn{border:none; background:#23262c; border-radius:10px;}
  body.theme-epure .fab{border-radius:18px; background:#c8f560; color:#0d0e10; box-shadow:0 10px 24px -8px rgba(200,245,96,0.6); font-weight:800;}
  body.theme-epure .chk{border-radius:50%; border:2px solid #3a3e46;}
  body.theme-epure .chk.done{background:#c8f560; color:#0d0e10; border-color:#c8f560; box-shadow:none;}
  body.theme-epure .subtask-chk{border-radius:50%;}
  body.theme-epure .item{border-bottom-color:#1f2227;}
  body.theme-epure .item-name{font-weight:600; font-size:14.5px;}
  body.theme-epure .item-meta .xp-tag{color:#c8f560;}
  body.theme-epure select, body.theme-epure input[type=text], body.theme-epure input[type=number], body.theme-epure input[type=date],
  body.theme-epure input[type=time], body.theme-epure textarea{background:#1f2227; border:none; border-radius:12px; padding:10px 12px;}
  body.theme-epure .radio-opt{border:none; background:#1f2227; border-radius:10px; font-weight:700;}
  body.theme-epure .radio-opt.active{background:#f2f3f5; color:#0d0e10;}
  body.theme-epure .rank-chip, body.theme-epure .term-chip{border-radius:999px;}
  body.theme-epure .skill-track, body.theme-epure .rank-seg, body.theme-epure .pomo-goal-seg{background:#23262c; border:none;}
  body.theme-epure .skill-fill{background:#f2f3f5;}
  body.theme-epure .rank-seg.filled, body.theme-epure .pomo-goal-seg.filled{background:#c8f560; box-shadow:none;}
  body.theme-epure .pomo-timer{font-weight:800; letter-spacing:-2px; text-shadow:none; font-size:68px;}
  body.theme-epure .cal-day{border:none; background:#1f2227; border-radius:12px;}
  body.theme-epure .cal-day.today{box-shadow:inset 0 0 0 2px #c8f560;}
  body.theme-epure .overlay{background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);}
  body.theme-epure .modal{border-radius:24px; border:1px solid #23262c; background:#16181c; box-shadow:0 30px 60px -20px rgba(0,0,0,0.9);}
  body.theme-epure .toast{border-radius:18px; border:1px solid #2a2d33; background:#1f2227; box-shadow:0 16px 30px -10px rgba(0,0,0,0.8);}
  body.theme-epure .toast .tt{color:#8b9099; letter-spacing:2px;} body.theme-epure .toast .tn{text-shadow:none;} body.theme-epure .toast .tr{color:#c8f560;}
  body.theme-epure .toast-penalty .tt, body.theme-epure .toast-penalty .tr{color:#ff7a6b;}
  body.theme-epure .ach-card{border:none; background:#1f2227; border-radius:18px;}
  body.theme-epure .oath-reminder{border-color:#2a2d33; background:none; border-radius:16px;}
  body.theme-epure .oath-reminder-tag{color:#c8f560;}
  body.theme-epure .tip-banner, body.theme-epure #installHint{background:#16181c; border:1px solid #23262c; color:#8b9099; border-radius:16px; font-family:var(--font-body);}
  body.theme-epure .mini-switch{background:#23262c; border:none;}
  body.theme-epure .mini-switch.on{background:#c8f560;}
  body.theme-epure .mini-switch.on::after{background:#0d0e10;}

  /* ===== En-têtes propres à chaque style (voir themeHeaderHtml) ===== */
  .hero{position:relative;}
  .hero-tools{position:absolute; top:12px; right:12px; display:flex; gap:6px; z-index:2;}
  .hero-tools .icon-btn{width:30px; height:30px; font-size:13px;}
  .hero-sigil{width:100%; height:100%; box-sizing:border-box; display:flex; align-items:center; justify-content:center;}
  .hero-sigil svg{width:100%; height:100%;}
  .hero-img{display:block; image-rendering:pixelated; width:auto;}
  .hero .xp-track{flex:none;} /* dans une colonne flex, flex:1 écrasait la hauteur de la barre à 0 */

  /* Monarque : portrait + puces */
  .hero-mo{padding:16px !important;}
  .mo-row{display:flex; gap:14px; align-items:center;}
  .mo-portrait{position:relative; width:92px; height:108px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; border-radius:18px;
    border:1px solid color-mix(in srgb, var(--rc) 60%, transparent);
    background:radial-gradient(ellipse 70% 55% at 50% 60%, color-mix(in srgb, var(--rc) 35%, transparent), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--rc) 12%, transparent), rgba(10,8,20,0.92));
    box-shadow:0 0 24px -4px color-mix(in srgb, var(--rc) 55%, transparent), inset 0 0 18px color-mix(in srgb, var(--rc) 15%, transparent);}
  .mo-portrait .hero-img{height:100px;}
  .mo-portrait .hero-sigil{padding:8px 6px 20px;}
  .mo-tab{position:absolute; left:50%; bottom:-1px; transform:translateX(-50%); padding:2px 10px; border-radius:8px 8px 0 0; background:var(--rc); color:#05121a; font-family:'Cinzel', serif; font-weight:700; font-size:12px; letter-spacing:2px;}
  .mo-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .mo-eyebrow{font-size:9px; letter-spacing:2.4px; color:var(--glow); font-weight:600; padding-right:72px;}
  .mo-name{font-family:'Cinzel', serif; font-weight:700; font-size:25px; letter-spacing:1.5px; color:#fff;}
  .mo-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .mo-chip{padding:4px 9px; border-radius:10px; background:rgba(255,255,255,0.05); font-size:11px; color:var(--text-dim);}
  .mo-chip b{color:#fff; font-weight:600;}
  .mo-chip.gold{background:rgba(245,196,81,0.12); color:var(--gold); font-weight:600;}
  .mo-xp{font-size:10px; color:var(--text-dim);}
  .hero-mo .xp-track{height:8px;}

  /* Système : fenêtre de statut clé / valeur */
  .hero-sy{padding:22px 14px 12px !important; margin-top:12px;}
  .sy-tag{position:absolute; top:-12px; left:50%; transform:translateX(-50%); padding:3px 14px; border:1px solid #3fa9ff; background:#06142b; font-family:var(--font-mono); font-size:11px; letter-spacing:3px; color:#7fd4ff; white-space:nowrap; z-index:2;}
  .hero-sy .hero-tools{position:static; justify-content:flex-end; margin-top:10px;}
  .sy-row{display:flex; gap:14px; align-items:stretch;}
  .sy-portrait{position:relative; width:96px; min-height:120px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:center; background:linear-gradient(180deg, rgba(63,169,255,0.18), rgba(3,10,24,0.9)); border:1px solid rgba(63,169,255,0.5);}
  .sy-c1, .sy-c2{position:absolute; width:12px; height:12px;}
  .sy-c1{top:-3px; left:-3px; border-top:2px solid #9fe0ff; border-left:2px solid #9fe0ff;}
  .sy-c2{bottom:-3px; right:-3px; border-bottom:2px solid #9fe0ff; border-right:2px solid #9fe0ff;}
  .sy-portrait .hero-img{height:112px;}
  .sy-portrait .hero-sigil{padding:10px 6px;}
  .sy-kv{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; gap:4px; font-family:var(--font-mono); font-size:12px;}
  .sy-kv > div{display:flex; justify-content:space-between; gap:8px;}
  .sy-kv > div > span:first-child{color:var(--text-dim);}
  .sy-big{color:#fff; font-size:15px;}
  .sy-rank{color:#7fd4ff; text-shadow:0 0 8px #3fa9ff; text-align:right;}
  .sy-gold{color:#ffd166;}
  .sy-kv > .sy-xp{display:block;}
  .sy-xp > div{display:flex; justify-content:space-between; margin-bottom:4px;}
  .sy-xp > div > span:first-child{color:var(--text-dim);}
  .hero-sy .xp-track{height:7px;}
  /* Système : fenêtre QUÊTE QUOTIDIENNE */
  .sq-head{display:flex; gap:10px; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:2px;}
  .sq-bang{width:20px; height:20px; border:1px solid #9fe0ff; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); color:#9fe0ff; font-size:13px;}
  .sq-sub{text-align:center; font-size:11px; color:#7fd4ff; margin:4px 0 12px;}
  .sq-list{display:flex; flex-direction:column; gap:2px;}
  .sq-row{display:flex; justify-content:space-between; gap:10px; width:100%; padding:8px 4px; font-family:var(--font-mono); font-size:13px; color:var(--text); background:none; border:none; text-align:left; cursor:pointer;}
  .sq-row span:last-child{color:var(--text-dim); flex-shrink:0;}
  .sq-row.done span:first-child{color:var(--text-dim);}
  .sq-row.done span:last-child{color:#6be3a0;}
  .sq-row:hover{background:rgba(63,169,255,0.08);}
  .sq-row.static{cursor:default;}
  .sq-row.static:hover{background:none;}
  .sq-warn{margin-top:12px; padding-top:10px; border-top:1px dashed rgba(63,169,255,0.35); font-size:11px; color:#ff6b7a; text-align:center; letter-spacing:.4px;}
  body.theme-systeme .oath-reminder{flex-direction:column; align-items:flex-start; gap:3px; border:1px solid rgba(255,209,102,0.55); background:rgba(40,30,6,0.45);}
  body.theme-systeme .oath-reminder-tag{font-family:var(--font-mono);}
  body.theme-systeme .oath-reminder-tag::before{content:'[ ';} body.theme-systeme .oath-reminder-tag::after{content:' ]';}
  body.theme-systeme .oath-reminder-text{white-space:normal;}

  /* Manhwa : case de BD + étoile de rang, titres en bandeau noir */
  .hero-mh{display:flex; padding:0 !important; overflow:hidden;}
  .mh-portrait{position:relative; width:120px; min-height:156px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:center; border-right:3px solid #111; background:repeating-linear-gradient(115deg, #fff 0 6px, #e9e4d8 6px 7px);}

    clip-path:polygon(50% 0, 62% 30%, 98% 20%, 72% 48%, 100% 78%, 64% 70%, 50% 100%, 38% 70%, 2% 80%, 28% 50%, 0 20%, 38% 30%);}

  .mh-line span{color:#d7263d;}
  .mh-xp{font-size:10px; font-weight:600;}
  .hero-mh .hero-tools{position:static; margin-top:4px;}
  body.theme-manhwa .panel:not(.head) > .eyebrow{display:none;}
  body.theme-manhwa .panel:not(.head) > h2{margin:-22px -22px 12px; padding:8px 12px; background:#111; color:#fff; font-size:19px;}
  body.theme-manhwa .panel-compact:not(.head) > h2{margin:-14px -14px 10px;}
  body.theme-manhwa .oath-reminder{width:fit-content; max-width:100%; flex-direction:column; align-items:flex-start; gap:2px; padding:10px 16px;}
  body.theme-manhwa .oath-reminder-tag{letter-spacing:1.5px;}
  body.theme-manhwa .oath-reminder-text{white-space:normal; font-style:italic; font-weight:600; font-size:14px;}
  body.theme-manhwa .oath-reminder-text::before{content:'« ';} body.theme-manhwa .oath-reminder-text::after{content:' »';}

  /* Donjon : portrait en arche, sceau de cire, titres ornés, cases en losange */

  .dj-portrait .hero-img{height:114px;}
  .dj-portrait .hero-sigil{padding:22px 8px 8px;}
  .dj-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
  .dj-eyebrow{font-family:var(--font-display); font-size:13px; letter-spacing:3px; color:#c9a24a;}
  .dj-name{font-family:var(--font-display); font-weight:700; font-size:32px; line-height:1; color:#f4e9cf;}
  .dj-line{font-size:13px; color:#b5a88c;}
  .dj-line span{color:#e0b75a;}
  .dj-xp{font-size:11px; color:#8d8068;}
  .hero-dj .hero-tools{position:static; justify-content:flex-end; margin-top:10px;}
  body.theme-donjon .panel:not(.head) > .eyebrow{justify-content:center;}
  body.theme-donjon .panel:not(.head) > .sub{text-align:center;}

  body.theme-donjon .chk.done::before{background:#c9a24a; box-shadow:0 0 10px rgba(201,162,74,0.5);}

  body.theme-donjon .oath-reminder-text{white-space:normal; font-family:var(--font-display); font-style:italic; font-size:18px; color:#f4e9cf;}
  body.theme-donjon .oath-reminder-text::before{content:'« ';} body.theme-donjon .oath-reminder-text::after{content:' »';}

  .ep-date{font-size:13px; color:#8b9099; font-weight:500;}
  .ep-hello{font-size:26px; font-weight:800; letter-spacing:-0.5px; color:#f2f3f5;}

  .ep-ring{position:relative; width:64px; height:64px; flex-shrink:0;}

  /* ===== Onglet Stats (version admin) : personnage à la place du portail ===== */
  .perso-stage{position:relative; width:170px; height:250px; flex-shrink:0; margin:0 auto; display:flex; align-items:flex-end; justify-content:center;}

  .perso-aura{position:absolute; left:-12%; right:-12%; top:4%; bottom:6%; border-radius:50%; background:radial-gradient(ellipse at 50% 58%, color-mix(in srgb, var(--pc) 42%, transparent), transparent 66%); animation:auraPulse 2.6s ease-in-out infinite;}
  .perso-ring{position:absolute; left:50%; top:46%; width:190px; height:190px; margin:-95px 0 0 -95px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--pc) 30%, transparent) 0deg 3deg, transparent 3deg 15deg);
    -webkit-mask-image:radial-gradient(circle, #000 35%, transparent 70%); mask-image:radial-gradient(circle, #000 35%, transparent 70%); animation:rbSpin 40s linear infinite;}
  .perso-floor{position:absolute; z-index:1; left:0; right:0; bottom:0; width:100%; height:44px; filter:drop-shadow(0 0 6px var(--pc)); animation:auraPulse 3.2s ease-in-out infinite;}
  .perso-rank{position:absolute; z-index:3; right:8px; top:6px; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Cinzel', Georgia, serif; font-weight:700; font-size:14px; color:var(--pc); border:1.5px solid var(--pc); background:rgba(0,0,0,0.45); box-shadow:0 0 12px color-mix(in srgb, var(--pc) 60%, transparent);}
  @media (prefers-reduced-motion: reduce){ .perso-aura, .perso-ring, .perso-floor{animation:none;} }
